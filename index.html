<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant personnalisation</title>
  <style>
  /* ── Galerie back-office ── */
  .gallery-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .gallery-layout { grid-template-columns: 1fr; } }
 
  .gallery-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .gallery-panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .gallery-panel-header h3 { font-size: 14px; font-weight: 600; flex: 1; }
  .gallery-panel-body { padding: 12px; }
 
  /* Grille de browsing commandes */
  .order-browse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .order-img-card { position: relative; border-radius: 6px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color .15s, box-shadow .15s; background: var(--bg); }
  .order-img-card.selected { border-color: var(--primary); }
  .order-img-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .order-img-card .img-meta { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 10px; padding: 3px 5px; line-height: 1.3; }
  .order-img-card .img-check { position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; display: none; align-items: center; justify-content: center; }
  .order-img-card.selected .img-check { display: flex; }
  .order-img-card .img-added { position: absolute; top: 5px; left: 5px; background: rgba(0,128,96,.85); color: #fff; font-size: 9px; padding: 2px 5px; border-radius: 3px; }
 
  /* Sélection en cours */
  .selection-preview { display: flex; flex-direction: column; gap: 10px; }
  .sel-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }
  .sel-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  .sel-item-body { flex: 1; min-width: 0; }
  .sel-item-title { font-size: 12px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sel-item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .sel-tag { background: var(--primary); color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 8px; display: flex; align-items: center; gap: 3px; }
  .sel-tag button { background: none; border: none; color: #fff; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; opacity: .7; }
  .sel-tag button:hover { opacity: 1; }
  .sel-item-remove { background: none; border: none; cursor: pointer; color: var(--text-sub); font-size: 16px; padding: 2px; }
  .sel-item-remove:hover { color: var(--critical); }
 
  .tag-input-row { display: flex; gap: 6px; margin-top: 4px; }
  .tag-input-row input { flex: 1; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; min-width: 0; }
  .tag-input-row input:focus { outline: none; border-color: var(--primary); }
 
  /* Galerie sauvegardée */
  .saved-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .saved-img-card { position: relative; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); background: var(--bg); }
  .saved-img-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .saved-img-card .saved-tags { display: flex; flex-wrap: wrap; gap: 2px; padding: 4px; }
  .saved-img-card .saved-tag { background: var(--primary); color: #fff; border-radius: 8px; font-size: 9px; padding: 1px 5px; }
  .saved-img-card .saved-actions { position: absolute; top: 4px; right: 4px; display: none; gap: 4px; }
  .saved-img-card:hover .saved-actions { display: flex; }
  .saved-img-card .saved-del { background: var(--critical); color: #fff; border: none; border-radius: 4px; width: 20px; height: 20px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .saved-img-card .market-badges { position: absolute; bottom: 4px; left: 4px; z-index: 2; display: flex; gap: 3px; pointer-events: none; }
  .saved-img-card .market-badge { color: #fff; border-radius: 8px; font-size: 8px; font-weight: 700; line-height: 1; padding: 2px 4px; box-shadow: 0 1px 2px rgba(0,0,0,.35); letter-spacing: .2px; }

  .gallery-filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .filter-tag-btn { padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; cursor: pointer; transition: background .15s; }
  .filter-tag-btn:hover, .filter-tag-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
 
  .gallery-empty { text-align: center; padding: 32px; color: var(--text-sub); font-size: 14px; }
  .gallery-load-more { width: 100%; margin-top: 10px; }
 
  .tag-suggestions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .tag-sug-btn { padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); font-size: 11px; cursor: pointer; color: var(--text-sub); }
  .tag-sug-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f6f6f7; --surface: #fff; --border: #e1e3e5; --text: #202223; --text-sub: #6d7175;
      --primary: #008060; --primary-hover: #006e52; --critical: #d82c0d;
      --critical-bg: #fff4f4; --critical-border: #fead9a;
      --warning: #8a5a00; --warning-bg: #fff5ea;
      --success: #008060; --success-bg: #f1f8f5; --info-bg: #f4f6f8;
      --radius: 8px; --shadow: 0 1px 3px rgba(0,0,0,.1); --header-height: 56px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* Login */
    #login-screen { display: none; position: fixed; inset: 0; background: var(--bg); z-index: 9000; align-items: center; justify-content: center; }
    #login-screen.show { display: flex; }
    .login-box { background: var(--surface); border-radius: 12px; padding: 40px; width: min(400px, 94vw); box-shadow: 0 8px 40px rgba(0,0,0,.15); text-align: center; }
    .login-box h1 { font-size: 24px; margin-bottom: 8px; }
    .login-box p { color: var(--text-sub); margin-bottom: 28px; font-size: 14px; }
    .login-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; margin-bottom: 12px; text-align: center; letter-spacing: 2px; }
    .login-box input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
    .login-error { color: var(--critical); font-size: 13px; margin-top: 8px; display: none; }

    /* ── Navigation : rail latéral fixe (icônes + alertes toujours visibles),
       remplace l'ancienne barre d'onglets du haut. Pas de mode replié/déplié :
       une seule largeur, volontairement compacte mais assez large pour les badges. ── */
    #shell { display: flex; align-items: flex-start; flex: 1; min-height: 0; }
    #sidebar { width: 96px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 200; }
    .sb-brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px 16px; font-weight: 700; font-size: 15px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .sb-brand-icon { font-size: 18px; flex-shrink: 0; display: flex; }
    .sb-brand-icon svg { width: 20px; height: 20px; stroke-width: 2; }
    .sb-brand .sb-label { display: none; }
    .sb-nav { display: flex; flex-direction: column; gap: 4px; padding: 0 8px; flex: 1; }
    .sb-item { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 4px; min-height: 52px; border-radius: var(--radius); color: var(--text-sub); font-size: 14px; cursor: pointer; border: none; background: none; width: 100%; font-family: inherit; }
    .sb-item:hover { background: var(--bg); }
    .sb-item.active { background: var(--success-bg); color: var(--primary); font-weight: 600; }
    .sb-icon { width: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .sb-icon svg { width: 22px; height: 22px; stroke-width: 2; }
    .sb-item .sb-label { display: none; }
    .sb-badges { display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: wrap; }
    .sb-badge { display: inline-block; font-size: 10px; line-height: 14px; font-weight: 700; padding: 0 6px; border-radius: 10px; background: var(--success-bg); color: var(--success); border: 1px solid #95c9b4; }
    .sb-badge.urgent { background: var(--critical); color: #fff; border-color: var(--critical); }
    .sb-alert-dot { position: absolute; top: 6px; right: 16px; color: var(--critical); display: flex; flex-shrink: 0; background: var(--surface); border-radius: 50%; }
    .sb-alert-dot svg { width: 14px; height: 14px; }
    .sb-footer { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--border); margin-top: 8px; }
    .sb-fbtn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); width: 44px; height: 44px; cursor: pointer; font-size: 14px; color: var(--text-sub); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sb-fbtn svg { width: 19px; height: 19px; stroke-width: 2; }
    .sb-fbtn:hover { background: var(--bg); color: var(--text); }

    #main { flex: 1; min-width: 0; }
    #content { padding: 16px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── Sous-onglets réutilisables (ex : langues du texte FOMO) — indépendants
       de la navigation principale, qui est maintenant portée par la sidebar ── */
    .tabs { display: flex; gap: 4px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; overflow-x: auto; }
    .tab-btn { padding: 12px 16px; border: none; background: none; cursor: pointer; font-size: 14px; color: var(--text-sub); border-bottom: 2px solid transparent; white-space: nowrap; transition: color .15s, border-color .15s; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .tab-btn .badge { display: inline-block; border-radius: 10px; font-size: 11px; padding: 0 6px; margin-left: 4px; line-height: 18px; }
    .tab-badge-urgent { background: var(--critical); color: #fff; }
    .tab-badge-total { background: var(--success-bg); color: var(--success); border: 1px solid #95c9b4; }

    /* ── Puces compactes (remplacent les 4 encarts chiffrés du tableau de bord) ── */
    .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { display: flex; align-items: baseline; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 7px 14px; font-size: 12.5px; color: var(--text-sub); cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .chip:hover { border-color: var(--primary); box-shadow: var(--shadow); }
    .chip b { font-size: 15px; color: var(--text); font-weight: 800; }
    .chip.zero b { color: var(--text-sub); }
    .chip.urgent { border-color: var(--critical); background: var(--critical-bg); }
    .chip.urgent b { color: var(--critical); }

    /* ── Ligne secondaire du tableau de bord : graphique (informatif) + notes ── */
    .dash-secondary-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; margin-top: 16px; }
    @media (max-width: 900px) { .dash-secondary-grid { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .card + .card { margin-top: 12px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    /* ── Bandeau paramètres rapides (tableau de bord) ── */
    .quick-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 16px; margin-bottom: 16px; }
    .quick-bar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .quick-bar-title { font-size: 13px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: .03em; }
    .quick-bar-recap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .recap-chip { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 14px; font-size: 12.5px; font-weight: 600; border: 1px solid transparent; }
    .recap-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .recap-chip.ok { background: var(--success-bg); color: var(--success); border-color: #95c9b4; }
    .recap-chip.ok .recap-dot { background: var(--success); }
    .recap-chip.off { background: var(--info-bg); color: var(--text-sub); border-color: var(--border); }
    .recap-chip.off .recap-dot { background: #b7bdc2; }
    .recap-chip.warn { background: var(--warning-bg); color: var(--warning); border-color: #eecf8b; }
    .recap-chip.warn .recap-dot { background: var(--warning); }
    .recap-chip.critical { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-border); }
    .recap-chip.critical .recap-dot { background: var(--critical); }
    .quick-bar-toggles { display: flex; flex-wrap: wrap; gap: 10px 22px; padding-top: 10px; border-top: 1px solid var(--border); }
    .toggle-row { display: flex; align-items: center; gap: 9px; }
    .toggle-label { font-size: 13px; font-weight: 500; }
    .toggle-sub { font-size: 11px; color: var(--text-sub); }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; cursor: pointer; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider { position: absolute; inset: 0; background: var(--critical); border-radius: 22px; transition: background .18s; }
    .switch .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .18s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
    .switch input:checked + .slider { background: var(--success); }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .switch input:disabled + .slider { opacity: .5; cursor: not-allowed; }

    .notes-list { display: flex; flex-direction: column; gap: 8px; }
    .note-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; background: var(--critical-bg); border: 1px solid var(--critical-border); border-radius: var(--radius); }
    .note-order { font-weight: 700; font-size: 13px; color: var(--critical); white-space: nowrap; }
    .note-text { flex: 1; font-size: 13px; color: var(--text); }
    .note-age { font-size: 11px; white-space: nowrap; }

    #order-sticky { position: sticky; top: 0; z-index: 100; background: var(--surface); border-bottom: 2px solid var(--border); padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .order-sticky-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .order-sticky-top h2 { font-size: 18px; font-weight: 700; }
    .prep-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .prep-label { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-right: 4px; }
    .prep-item { background: var(--info-bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }

    .nav-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .nav-bar select { flex: 1; min-width: 160px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; background: var(--surface); cursor: pointer; }
    .nav-bar .counter { color: var(--text-sub); font-size: 13px; white-space: nowrap; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; white-space: nowrap; text-decoration: none; }
    .btn:hover { background: #f6f6f7; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-critical { background: var(--critical); color: #fff; border-color: var(--critical); }
    .btn-lg { padding: 12px 24px; font-size: 16px; font-weight: 600; width: 100%; justify-content: center; }
    .btn-warning { background: var(--warning-bg); color: var(--warning); border-color: var(--warning); }

    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-critical { background: var(--critical-bg); color: var(--critical); border: 1px solid var(--critical-border); }
    .badge-warning { background: var(--warning-bg); color: var(--warning); border: 1px solid #f1c84b; }
    .badge-success { background: var(--success-bg); color: var(--success); border: 1px solid #95c9b4; }
    .badge-info { background: var(--info-bg); color: var(--text); border: 1px solid var(--border); }

    .alert { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--radius); margin-bottom: 12px; }
    .alert-critical { background: var(--critical-bg); border: 1px solid var(--critical-border); }
    .alert-critical strong { color: var(--critical); }
    .alert-warning { background: var(--warning-bg); border: 1px solid #f1c84b; }
    .alert-warning strong { color: var(--warning); }
    .alert .alert-text { color: var(--text); }

    .lineitem-grid { display: grid; grid-template-columns: 64px 1fr clamp(220px, 30%, 320px); gap: 18px; align-items: start; }
    .qty-cell { text-align: center; }
    .qty-num { font-size: 28px; font-weight: 700; line-height: 1; }
    .qty-label { font-size: 11px; color: var(--text-sub); }
    .product-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .product-variant, .product-sku { color: var(--text-sub); font-size: 13px; margin-bottom: 2px; }
    .attr-item { font-size: 12px; color: var(--text-sub); }
    .dl-link { font-size: 13px; color: var(--primary); text-decoration: none; margin-top: 6px; display: inline-block; }
    /* ── Vue commandes custom : poste tactile + pavé numérique ── */
    :root { --rail-w: 168px; }
    #content.has-rail { padding-right: calc(var(--rail-w) + 32px); max-width: calc(1100px + var(--rail-w) + 16px); }
    body.rail-mode #scroll-top { display: none !important; }
    .qty-num { font-size: 40px; }
    .product-title { font-size: 17px; font-weight: 700; text-transform: uppercase; }
    .variant-big { font-size: 21px; font-weight: 600; margin: 2px 0 2px; }
    .variant-big .size-chip { display: inline-block; min-width: 46px; text-align: center; padding: 1px 10px; border-radius: 8px; background: var(--text); color: var(--surface); margin-right: 8px; }
    .perso-list { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-top: 12px; align-items: baseline; }
    .perso-list dt { color: var(--text-sub); font-size: 13px; }
    .perso-list dd { margin: 0; font-weight: 700; font-size: 17px; word-break: break-word; }
    .raw-links { margin-top: 10px; font-size: 12px; color: var(--text-sub); }
    .raw-links summary { cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; }
    .raw-links div { word-break: break-all; padding: 2px 0; }
    .dl-discreet { display: inline-block; margin-top: 4px; font-size: 12px; color: var(--text-sub); text-decoration: underline; text-underline-offset: 2px; }
    .co-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
    .co-filter { display: inline-flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .co-filter button { border: 0; background: none; min-height: 48px; padding: 0 18px; border-radius: 9px; font: inherit; font-size: 16px; font-weight: 600; color: var(--text-sub); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .co-filter .n { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: var(--info-bg); font-variant-numeric: tabular-nums; }
    .co-filter button.on { background: var(--text); color: var(--surface); }
    .co-filter button.on .n { background: rgba(255,255,255,.2); color: inherit; }
    .co-filter button.urg .n { background: var(--critical-bg); color: var(--critical); }
    .co-filter button.urg.on { background: var(--critical); color: #fff; }
    .co-filter button.urg.on .n { background: rgba(255,255,255,.25); color: #fff; }
    .co-search { margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 8px 0 16px; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; min-width: 260px; }
    .co-search.typing { border-color: var(--primary); box-shadow: 0 0 0 4px var(--success-bg); }
    .co-search .hash { font-size: 22px; font-weight: 600; color: var(--text-sub); }
    .co-search .val { flex: 1; min-width: 80px; font-size: 24px; font-weight: 700; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .co-search .val:empty::before { content: "Taper un n\00b0  au pav\00e9"; font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--text-sub); }
    .co-search button { min-height: 44px; padding: 0 14px; border-radius: 9px; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
    .co-search .go { background: var(--primary); color: #fff; }

    #co-rail > * { border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }

    #co-sheet { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.45); display: flex; justify-content: flex-end; }

    #co-sheet h3 button { margin-left: auto; min-width: 48px; min-height: 48px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font-size: 20px; cursor: pointer; }
    #co-sheet .row { display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }

    #co-sheet .row .who { flex: 1; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ── Vue commande tactile (proto Impeccable, sept. 2026) ── */

    .co-deadline.tone-info { background: var(--info-bg); border-color: var(--border); color: var(--text); }
    .co-meta { margin: 0; flex: 1 1 420px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--border); border-radius: 12px; }
    .co-meta > div { padding: 10px 16px; border-right: 1px solid var(--border); min-width: 0; }

    .co-meta dt { font-size: 14px; color: var(--text-sub); }

    .co-meta .tone-critical { color: #b8260b; }

    .co-note { display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px; border-radius: 12px; background: var(--critical-bg); border: 1px solid var(--critical-border); font-size: 18px; }

    .co-note strong { color: #b8260b; }

    #order-sticky .prep-list { gap: 10px; }
    #order-sticky .prep-label { font-size: 15px; font-weight: 700; }

    .co-item { border-radius: 16px; padding: 22px 24px; }

    .co-item .product-sku { font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }
    .co-item .perso-list { grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--bg); }

    .co-item .raw-links { margin-top: 14px; font-size: 14px; }

    #co-rail .ico { font-size: 24px; }
    #co-rail .co-next .arrow { font-size: 52px; display: flex; }

    .img-cell img { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); object-fit: contain; aspect-ratio: 1/1; display: block; cursor: zoom-in; }

    /* Supplier workflow */
    .workflow-steps { display: flex; flex-direction: column; gap: 16px; }
    .step { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .step-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--bg); border-bottom: 1px solid var(--border); }
    .step-number { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-number.done { background: var(--success); }
    .step-number.locked { background: var(--border); color: var(--text-sub); }
    .step-title { font-weight: 600; font-size: 15px; }
    .step-desc { font-size: 13px; color: var(--text-sub); }
    .step-body { padding: 16px; background: var(--surface); }
    .step-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .order-count-badge { background: var(--info-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 14px; font-size: 13px; margin-bottom: 12px; }
    .order-count-badge strong { font-size: 18px; color: var(--primary); }

    /* Print tab */
    .print-order-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .print-order-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: background .15s; }
    .print-order-item:hover { background: var(--bg); }
    .print-order-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); flex-shrink: 0; }
    .print-order-item.deselected { opacity: .5; }
    .print-order-info { flex: 1; }
    .print-order-name { font-weight: 700; font-size: 14px; }
    .print-order-detail { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .print-order-note { font-size: 12px; color: var(--critical); margin-top: 4px; font-style: italic; }
    .print-order-files { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

    .zip-result { background: var(--success-bg); border: 1px solid #95c9b4; border-radius: var(--radius); padding: 16px; margin-top: 12px; }
    .zip-result a { color: var(--primary); font-weight: 600; }

    #img-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 9999; align-items: center; justify-content: center; cursor: pointer; }
    #img-modal.open { display: flex; }
    #img-modal img { max-width: 92vw; max-height: 92vh; border-radius: 10px; object-fit: contain; cursor: default; }
    #img-modal-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,.2); border: none; color: #fff; font-size: 28px; cursor: pointer; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    #img-modal-prev, #img-modal-next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.2); border: none; color: #fff; font-size: 32px; line-height: 1; cursor: pointer; border-radius: 50%; width: 48px; height: 48px; display: none; align-items: center; justify-content: center; }
    #img-modal-prev:hover, #img-modal-next:hover, #img-modal-close:hover { background: rgba(255,255,255,.35); }
    #img-modal-prev { left: 16px; }
    #img-modal-next { right: 16px; }
    #img-modal-caption { position: absolute; bottom: 20px; left: 16px; right: 16px; text-align: center; color: #fff; font-size: 14px; cursor: default; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

    /* ── Écran de veille — se déclenche après inactivité, palette sombre volontairement
       distincte du thème clair de l'appli (c'est un mode "vitrine", pas un écran de travail) ── */
    #screensaver { display: none; position: fixed; inset: 0; z-index: 10000; overflow: hidden;
      background:
        radial-gradient(1200px 700px at 15% 15%, #103b2c 0%, transparent 60%),
        radial-gradient(1000px 800px at 85% 85%, #0d2e22 0%, transparent 55%),
        linear-gradient(160deg, #071711, #050e0b 60%, #071812);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      align-items: center; justify-content: center; }
    #screensaver.open { display: flex; }
    #screensaver .ss-brand { position: absolute; top: 28px; left: 32px; opacity: .5; font-weight: 700; font-size: 14px; letter-spacing: .04em; }
    #screensaver .ss-clock { position: absolute; top: 26px; right: 32px; text-align: right; opacity: .55; font-variant-numeric: tabular-nums; }
    #screensaver .ss-clock .t { font-size: 20px; font-weight: 700; }
    #screensaver .ss-clock .d { font-size: 11px; text-transform: capitalize; }
    #screensaver .ss-panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; opacity: 0; transition: opacity .9s ease; pointer-events: none; }
    #screensaver .ss-panel.active { opacity: 1; pointer-events: auto; }
    #screensaver .ss-eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #4fd8a4; margin-bottom: 16px; }
    #screensaver .ss-hero { font-size: clamp(64px,11vw,140px); font-weight: 800; line-height: .95; letter-spacing: -.02em; background: linear-gradient(135deg,#eafff5,#7fe9bd); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    #screensaver .ss-sub { margin-top: 14px; font-size: 18px; color: rgba(255,255,255,.75); }
    #screensaver .ss-tag { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: rgba(255,255,255,.8); padding: 8px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; }
    #screensaver .ss-tag.good { background: rgba(79,216,164,.12); border-color: rgba(79,216,164,.35); color: #7fe9bd; }
    #screensaver .ss-gallery { display: grid; grid-template-columns: repeat(4,140px); gap: 12px; margin-top: 6px; }
    #screensaver .ss-gcell { width: 140px; height: 140px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); }
    #screensaver .ss-gcell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #screensaver .ss-quote { font-size: clamp(24px,3.4vw,38px); font-weight: 700; max-width: 880px; line-height: 1.3; }
    #screensaver .ss-quote-by { margin-top: 14px; font-size: 13px; color: rgba(255,255,255,.45); }
    #screensaver .ss-dots { position: absolute; bottom: 52px; left: 0; right: 0; display: flex; justify-content: center; gap: 7px; }
    #screensaver .ss-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background .3s; }
    #screensaver .ss-dot.active { background: #4fd8a4; }
    #screensaver .ss-hint { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255,255,255,.35); }
    @media (max-width: 900px) { #screensaver .ss-gallery { grid-template-columns: repeat(3,110px); } #screensaver .ss-gcell { width: 110px; height: 110px; } }

    #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 8888; align-items: center; justify-content: center; }
    #settings-modal.open { display: flex; }

    .note-modal-ack .ico { font-size: 28px; stroke-width: 2.6; }

    .settings-box { background: var(--surface); border-radius: 12px; padding: 28px; width: min(500px, 94vw); box-shadow: 0 8px 40px rgba(0,0,0,.2); max-height: 90vh; overflow-y: auto; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; padding: 48px; color: var(--text-sub); }
    kbd { background: var(--info-bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: monospace; }
    .history-table { width: 100%; border-collapse: collapse; }
    .history-table th, .history-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; font-size: 14px; }
    .history-table th { font-weight: 600; background: var(--bg); color: var(--text-sub); font-size: 12px; text-transform: uppercase; }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table tr:hover td { background: var(--bg); }

    #scroll-top { position: fixed; bottom: 24px; right: 24px; width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,128,96,.4); display: none; align-items: center; justify-content: center; z-index: 300; }
    #scroll-top.visible { display: flex; }
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; opacity: 0; transition: all .25s; z-index: 500; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      .lineitem-grid { grid-template-columns: 48px 1fr; gap: 10px; }
      .lineitem-grid .img-cell { grid-column: 1 / -1; }
      .qty-num { font-size: 22px; }
      #content { padding: 10px; }
    }
  /* ── Confetti animation ── */
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* ── Supplier notes block ── */
  .supplier-notes-block {
    margin-top: 14px;
    border: 1px solid #f1c84b;
    border-radius: 6px;
    overflow: hidden;
    max-width: 100%;
  }
  .supplier-notes-header {
    background: #fdf8ec;
    color: #7a5600;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 14px;
    border-bottom: 1px solid #f1c84b;
  }
  .supplier-note-row {
    display: grid;
    grid-template-columns: 70px 160px 1fr;
    gap: 10px;
    align-items: baseline;
    padding: 9px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    background: #fffdf5;
  }
  .supplier-note-row:last-child { border-bottom: none; }
  .supplier-note-order { font-weight: 700; color: var(--text); white-space: nowrap; }
  .supplier-note-client { color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .supplier-note-text { color: #7a5600; line-height: 1.5; }

  /* ════════════════════════════════════════════════════════════════
     SYSTÈME BUREAU (sept. 2026) — onglets Tableau de bord, Fournisseur,
     Impression, Galerie, Délais & FOMO. Interface souris/clavier classique.
     La vue « Commandes custom » (tactile) garde ses propres styles co-*.
     ════════════════════════════════════════════════════════════════ */
  :root {
    --text-strong: #b8260b; --warning-text: #6b4700;
    --success-border: #95c9b4; --warning-border: #f1c84b; --warning-soft: #fffbef;
    --radius-sm: 6px; --focus: 0 0 0 3px rgba(0,128,96,.22);
  }
  ::selection { background: #cde9dd; color: var(--text); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-sub); font-size: 13px; }
  .text-critical { color: var(--critical); }
  .text-success { color: var(--success); }
  .text-warning { color: var(--warning); }
  code { font: 12px/1.4 ui-monospace, Consolas, monospace; background: var(--info-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  /* En-tête de page : titre + contexte à gauche, actions à droite */
  .page-head { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; margin: 4px 0 20px; }
  .page-head h1 { font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
  .page-head .page-sub { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .page-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .page-head.sticky { position: sticky; top: 0; z-index: 150; background: var(--bg); margin: -16px 0 16px; padding: 16px 0 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .page-head.sticky .tabs { flex-basis: 100%; }

  /* Cartes */
  .card-title .ico { font-size: 18px; color: var(--text-sub); }
  .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .card-head .card-title { margin-bottom: 0; }
  .card-head .card-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .card-desc { font-size: 13px; color: var(--text-sub); margin: -4px 0 14px; max-width: 80ch; }
  .card.tone-critical { border-color: var(--critical-border); box-shadow: 0 1px 3px rgba(216,44,13,.12); }
  .card.tone-critical .card-title, .card.tone-critical .card-title .ico { color: var(--text-strong); }
  .card-stack { display: flex; flex-direction: column; gap: 16px; }
  .card-stack > .card + .card, .card-stack > * + .card { margin-top: 0; }
  .section-sep { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
  .section-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }

  /* Boutons */
  .btn { min-height: 36px; justify-content: center; }
  .btn .ico { font-size: 16px; }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn-primary:disabled:hover { background: var(--primary); }
  .btn-sm { min-height: 30px; padding: 0 10px; font-size: 13px; gap: 5px; }
  .btn-sm .ico { font-size: 14px; }
  .btn-danger { color: var(--critical); }
  .btn-danger:hover { background: var(--critical-bg); border-color: var(--critical-border); }
  .btn-icon { width: 36px; padding: 0; }
  .btn-icon.btn-sm { width: 30px; }
  .btn-link { border: 0; background: none; color: var(--primary); padding: 0; cursor: pointer; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Badges : icône + libellé */
  .badge { gap: 4px; line-height: 18px; white-space: nowrap; }
  .badge .ico { font-size: 12px; stroke-width: 2.4; }
  .badge-solid-critical { background: var(--critical); color: #fff; border: 1px solid var(--critical); }
  .badge-muted { background: var(--info-bg); color: var(--text-sub); border: 1px solid var(--border); }

  /* Champs */
  .input, .form-group input:not([type=checkbox]):not([type=radio]):not([type=file]), .form-group select, .form-group textarea, .settings-box input {
    width: 100%; min-height: 36px; padding: 7px 10px; border: 1px solid #c9cccf; border-radius: var(--radius); background: var(--surface); font-size: 14px; line-height: 1.4; transition: border-color .15s, box-shadow .15s; }
  textarea.input, .form-group textarea { resize: vertical; }
  .input:focus, .form-group input:focus, .form-group select:focus, .form-group textarea:focus, .settings-box input:focus { outline: none; border-color: var(--primary); box-shadow: var(--focus); }
  .input:disabled { background: var(--info-bg); color: var(--text-sub); cursor: not-allowed; }
  .input-sm { min-height: 30px; padding: 4px 8px; font-size: 13px; }
  .form-group label { font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 5px; }
  .form-group .settings-hint, .field-hint { font-size: 12px; color: var(--text-sub); margin-top: 5px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 20px; }
  .form-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 700px) { .form-grid.cols-2 { grid-template-columns: 1fr; } }
  .field-narrow input { max-width: 180px; }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  .check-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
  .option-box { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
  .option-box input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
  .option-box.is-locked { background: var(--info-bg); cursor: default; }
  .option-box .muted { font-weight: 400; }
  .option-sub { margin: 8px 0 0 12px; padding-left: 14px; border-left: 2px solid var(--border); }
  .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
  .file-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .file-row input[type=file] { flex: 1; min-width: 0; font-size: 12px; color: var(--text-sub); }
  .search-results { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .search-result { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); font-size: 13px; cursor: pointer; }
  .search-result:hover:not(:disabled) { border-color: var(--primary); background: var(--success-bg); }
  .search-result:disabled { opacity: .55; cursor: default; }
  .search-result img { width: 28px; height: 28px; object-fit: cover; border-radius: 4px; }
  .search-result .aside { margin-left: auto; font-size: 12px; color: var(--success); display: inline-flex; align-items: center; gap: 4px; }

  /* Sous-onglets (galerie, niches, langues FOMO) */
  .tabs.plain { background: none; padding: 0; margin-bottom: 14px; }
  .tab-btn { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .tab-btn .ico { font-size: 16px; }
  .tab-btn .tab-count { font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 10px; line-height: 18px; background: var(--info-bg); color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .tab-btn.active .tab-count { background: var(--success-bg); color: var(--primary); }
  .tabs.accent .tab-btn.active { color: var(--tab-accent, var(--primary)); border-bottom-color: var(--tab-accent, var(--primary)); }
  .tabs.accent .tab-btn.active .tab-count { background: var(--info-bg); color: var(--tab-accent, var(--primary)); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--text-sub)); flex-shrink: 0; display: inline-block; }

  /* Listes de lignes */
  .row-list { display: flex; flex-direction: column; }
  .row-item { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .row-item .row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .row-item .row-aside { margin-left: auto; font-size: 13px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty-inline { color: var(--text-sub); font-size: 13px; display: flex; align-items: center; gap: 6px; padding: 4px 0; }
  .empty-inline .ico { font-size: 16px; }
  .empty-inline.ok, .empty-inline.ok .ico { color: var(--success); }

  /* Tableau de bord */
  .stat-chip { font: inherit; font-size: 13px; }
  .stat-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .chip b { font-variant-numeric: tabular-nums; }
  .quick-bar-title { display: flex; align-items: center; gap: 6px; }
  .quick-bar-title .ico { font-size: 15px; }
  .cal-legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-sub); margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--sw); display: inline-block; }
  .cal-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
  .cal-day { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 56px; height: 94px; flex-shrink: 0; border-radius: var(--radius); cursor: pointer; padding: 6px 0 8px; border: 1.5px solid var(--ring, var(--border)); background: var(--surface); font: inherit; color: var(--text); transition: box-shadow .15s, transform .15s; }
  .cal-day:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .cal-day.today { border: 2px solid var(--primary); }
  .cal-day.selected { background: var(--success-bg); }
  .cal-day .m { font-size: 10px; color: var(--text-sub); line-height: 1; height: 11px; }
  .cal-day .w { font-size: 10px; color: var(--text-sub); text-transform: uppercase; line-height: 1; }
  .cal-day .d { font-size: 13px; font-weight: 600; line-height: 1; color: var(--text-sub); }
  .cal-day .n { font-size: 19px; font-weight: 800; line-height: 1.15; min-height: 22px; font-variant-numeric: tabular-nums; display: flex; align-items: center; }
  .cal-day .n .ico { font-size: 18px; stroke-width: 3; }
  .cal-day .bar { width: 34px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; margin-top: auto; }
  .cal-day .bar > span { display: block; height: 100%; background: var(--success); }
  .cal-detail { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
  .cal-detail .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chart-wrap { position: relative; overflow-x: auto; }
  .chart-wrap svg { width: 100%; height: auto; min-width: 480px; display: block; }
  .chart-tip { position: fixed; display: none; pointer-events: none; background: var(--text); color: #fff; font-size: 12px; padding: 6px 9px; border-radius: var(--radius-sm); z-index: 10000; max-width: 240px; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .data-table th, .data-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .data-table th { color: var(--text-sub); font-weight: 600; font-size: 12px; }
  .data-table td { font-variant-numeric: tabular-nums; }
  .note-age { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Fournisseur */
  .supplier-notes-block { margin-top: 14px; border-color: var(--warning-border); border-radius: var(--radius); }
  .supplier-notes-header { display: flex; align-items: center; gap: 8px; background: var(--warning-soft); color: var(--warning-text); }
  .supplier-notes-header .ico { font-size: 16px; }
  .supplier-note-row { grid-template-columns: minmax(130px, max-content) 170px 1fr; background: #fff; align-items: center; }
  .supplier-note-order { display: inline-flex; align-items: center; gap: 6px; }
  .supplier-note-text { color: var(--text); }
  .supplier-note-row .badge { justify-self: start; }
  .order-count-badge { display: flex; align-items: baseline; gap: 6px; }
  .step-status { margin-top: 12px; }

  /* Impression */
  .print-order-item { cursor: pointer; }
  .print-order-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .print-order-note { display: flex; align-items: flex-start; gap: 6px; font-style: normal; }
  .print-order-note .ico { margin-top: 2px; }
  .zip-result { display: flex; flex-direction: column; gap: 6px; }
  .zip-result .zip-title { display: flex; align-items: center; gap: 6px; font-weight: 600; color: var(--success); }
  .zip-result a { display: inline-flex; align-items: center; gap: 6px; }
  .lot-row { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .lot-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .lot-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .lot-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lot-names { font-size: 12px; color: var(--text-sub); margin-top: 3px; }
  .lot-comment { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
  .lot-comment textarea { flex: 1; min-height: 36px; font-size: 13px; }

  /* Galerie */
  .gallery-panel { box-shadow: var(--shadow); }
  .gallery-panel-header h3 { display: flex; align-items: center; gap: 8px; }
  .gallery-panel-header h3 .ico { font-size: 17px; color: var(--text-sub); }
  .gallery-panel-header .btn { margin-left: auto; }
  .gallery-panel-body > .card-desc { margin-top: 0; }
  .gallery-sel-panel { position: sticky; top: 132px; }
  .browse-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; }
  .browse-bar .btn-group { margin-left: auto; }
  .niche-badge { position: absolute; top: 5px; left: 5px; background: var(--niche, #888); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; line-height: 16px; }
  .niche-badge.inline { position: static; margin-right: 4px; vertical-align: 1px; }
  .order-img-card { border-radius: var(--radius); }
  .order-img-card:hover { border-color: var(--border); box-shadow: var(--shadow); }
  .order-img-card.selected:hover { border-color: var(--primary); }
  .order-img-card.is-saved img { opacity: .45; }
  .order-img-card .saved-flag { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .order-img-card .saved-flag span { display: inline-flex; align-items: center; gap: 4px; background: var(--success); color: #fff; border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 700; }
  .order-img-card .variant-strip { position: absolute; bottom: 22px; left: 0; right: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; padding: 2px 5px; text-align: center; }
  .order-img-card .img-check .ico { font-size: 12px; stroke-width: 3; }
  .img-meta { font-variant-numeric: tabular-nums; }
  .saved-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .saved-toolbar .hint { margin-left: auto; font-size: 12px; color: var(--text-sub); display: inline-flex; align-items: center; gap: 4px; }
  .bulk-box { background: var(--info-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; }
  .saved-img-card { cursor: grab; }
  .saved-img-card.is-selected { outline: 2px solid var(--primary); outline-offset: 2px; }
  .saved-img-card img { cursor: pointer; }
  .saved-img-card .sel-box { position: absolute; top: 5px; left: 5px; z-index: 2; }
  .saved-img-card .sel-box input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }
  .saved-img-card .official-flag { position: absolute; top: 4px; right: 4px; z-index: 2; background: #c9a227; color: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .saved-img-card .official-flag .ico { font-size: 11px; fill: currentColor; }
  .saved-img-card .saved-actions { top: 4px; right: 4px; z-index: 3; }
  .saved-img-card .saved-actions button { width: 26px; height: 26px; border: 0; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; background: rgba(32,34,35,.82); }
  .saved-img-card .saved-actions button:hover { background: var(--text); }
  .saved-img-card .saved-actions button.del:hover { background: var(--critical); }
  .saved-img-card .saved-actions .ico { font-size: 14px; }
  .saved-img-card:focus-within .saved-actions { display: flex; }
  .saved-img-card .var-id { font-size: 10px; color: var(--text-sub); padding: 0 4px 3px; text-align: center; font-variant-numeric: tabular-nums; }
  .saved-img-card .tag-edit { padding: 6px; background: var(--surface); display: flex; flex-direction: column; gap: 5px; }
  .g-tag { display: inline-flex; align-items: center; gap: 3px; background: var(--primary); color: #fff; border-radius: 10px; font-size: 11px; padding: 1px 7px; line-height: 16px; }
  .g-tag button { background: none; border: 0; color: #fff; cursor: pointer; padding: 0; display: flex; opacity: .8; }
  .g-tag button:hover { opacity: 1; }
  .g-tag .ico { font-size: 11px; }
  .saved-img-card .saved-tag { font-size: 10px; padding: 1px 6px; }
  .tag-sug-btn:focus-visible, .filter-tag-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  .sel-item-remove { display: flex; border-radius: var(--radius-sm); }
  .sel-item-remove:hover { background: var(--critical-bg); }
  .count-pill { font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 10px; line-height: 18px; background: var(--info-bg); color: var(--text-sub); font-variant-numeric: tabular-nums; }
  .saved-img-card .market-badges { bottom: auto; top: 26px; left: 5px; }
  .sel-empty { text-align: center; padding: 28px 12px; color: var(--text-sub); font-size: 13px; }
  .sel-empty .ico { font-size: 28px; display: block; margin: 0 auto 8px; opacity: .5; }
  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .icon-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 12px 12px; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .icon-card .thumb { width: 64px; height: 64px; border-radius: var(--radius); background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden; color: var(--text-sub); }
  .icon-card .thumb img { width: 100%; height: 100%; object-fit: contain; }

<script>

const state = {
  activeTab: 'dashboard',
  proxyUrl: '', appPassword: '', shop: '',
  isLoggedIn: false,
  orders: [], currentIndex: 0, filterUrgent: false,
  orderSearchActive: false, orderSearchQuery: '', typedOrderNum: '', customCounts: { all: null, urgent: null },
  supplierOrders: [], supplierSnapshot: [],
  // Print tab
  printOrders: [],       // commandes TODOPRINT avec métafields teeinblue
  printSelected: new Set(), // IDs sélectionnés
  printZipDone: false,
  printZipOrderIds: [],  // IDs des commandes zippées (pour suppression tag)
  printLots: [],         // historique des lots d'impression (commentaire, commandes, date)
  printLotsLoaded: false,
  printWizardStep: 1,    // étape affichée du cadre unique (1/2/3)
  dashboardCalendarData: {},
  dashboardProcessingBuckets: null,
  calendarSelectedDay: null,
  screensaverGalleryCache: null,
  screensaverGalleryCacheAt: 0,
  // Délais & FOMO
  delaisLoaded: false,
  delais: {
    delaiProduction: '', delaiRush: '', delaiPlancher: '',
    rushProductId: '', rushProductTitle: '', rushActif: false,
    fomoActif: false, fomoTexte: '', fomoCode: '', fomoFin: '', fomoPourcentage: '',
    fomoTexteId: '', fomoTexteDigest: '',
    // Traductions du texte FOMO par marche (langue non-FR). fr = valeur de base ci-dessus.
    fomoLocales: ['en', 'es', 'de', 'it'],
    fomoTranslations: { en: { value: '', digest: '', outdated: false }, es: { value: '', digest: '', outdated: false }, de: { value: '', digest: '', outdated: false }, it: { value: '', digest: '', outdated: false } },
    fomoLocaleTab: 'fr',
    periodes: [], // [{id, debut, fin, label}]
  },
  delaisRushSearchResults: [],
  delaisShowAddPeriode: false,
};

const HIDDEN_KEYS = ['_tib_design_link_1', '_customization_image', '_customization_id'];

// ════════════════════════════════════════════
// AUTH & SETTINGS
// ════════════════════════════════════════════
function loadSettings() {
  state.proxyUrl = localStorage.getItem('proxyUrl') || '';
  state.appPassword = localStorage.getItem('appPassword') || '';
  // Extraire le shop depuis l'URL proxy
  const proxyHost = (localStorage.getItem('proxyUrl') || '').replace('https://','').split('/')[0];
  state.shop = localStorage.getItem('shop') || proxyHost.replace('.vercel.app','') || '';

  state.isLoggedIn = sessionStorage.getItem('loggedIn') === '1';
}

function checkAuth() {
  if (!state.isLoggedIn) { document.getElementById('login-screen').classList.add('show'); return false; }
  return true;
}

async function tryLogin() {
  const input = document.getElementById('login-input');
  const pwd = input.value.trim();
  if (!pwd) return;
  try {
    const res = await fetch(state.proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Password': pwd },
      body: JSON.stringify({ query: '{ shop { name } }', variables: {} }),
    });
    if (res.status === 401) { document.getElementById('login-error').style.display = 'block'; input.value = ''; return; }
    state.appPassword = pwd;
    localStorage.setItem('appPassword', pwd);
    sessionStorage.setItem('loggedIn', '1');
    state.isLoggedIn = true;
    document.getElementById('login-screen').classList.remove('show');
    document.getElementById('login-error').style.display = 'none';
    renderDashboard();
    resetScreensaverTimer();
  } catch(e) {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent = 'Erreur de connexion — vérifie l\'URL proxy';
  }
}

function logout() { sessionStorage.removeItem('loggedIn'); state.isLoggedIn = false; document.getElementById('login-screen').classList.add('show'); document.getElementById('login-input').value = ''; }

function saveSettings() {
  const url = document.getElementById('cfg-proxy-url').value.trim();
  const pwd = document.getElementById('cfg-password').value.trim();

  if (!url) { showToast('⚠️ Remplis l\'URL proxy', 'warning'); return; }
  localStorage.setItem('proxyUrl', url); state.proxyUrl = url;
  if (pwd) { localStorage.setItem('appPassword', pwd); state.appPassword = pwd; }

  closeSettings();
  showToast('✅ Configuration sauvegardée');
}

function openSettings() {
  document.getElementById('cfg-proxy-url').value = state.proxyUrl;
  document.getElementById('cfg-password').value = '';

  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }

// ════════════════════════════════════════════
// GRAPHQL
// ════════════════════════════════════════════
async function gql(query, variables = {}) {
  const res = await fetch(state.proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Password': state.appPassword },
    body: JSON.stringify({ query, variables }),
  });
  if (res.status === 401) { logout(); throw new Error('Session expirée'); }
  if (!res.ok) throw new Error(`Proxy error ${res.status}`);
  const json = await res.json();
  if (json.errors?.length) throw new Error(json.errors.map(e => e.message).join(', '));
  return json.data;
}

async function callGas(orders) {
  // Appel via proxy Vercel
  const res = await fetch(state.proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Password': state.appPassword },
    body: JSON.stringify({ action: 'generateZip', orders }),
  });
  if (!res.ok) throw new Error(`Proxy error ${res.status}`);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ════════════════════════════════════════════
// TABS
// ════════════════════════════════════════════
function switchTab(tab) {
  if (!checkAuth()) return;
  state.activeTab = tab;
  document.getElementById('content').classList.toggle('has-rail', tab === 'custom');
  document.body.classList.toggle('rail-mode', tab === 'custom');
  closeOrderSheet();
  document.querySelectorAll('.sb-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (!state.proxyUrl) {
    document.getElementById('content').innerHTML = `<div class="empty"><p style="margin-bottom:14px;">L'appli n'est pas encore reliée au proxy Vercel.</p><button class="btn btn-primary" onclick="openSettings()">${icon('settings')}Configurer</button></div>`;
    return;
  }
  if (tab === 'custom') {
    // Si on a déjà des commandes en mémoire, on re-render sans recharger Shopify
    if (state.orders.length > 0) renderOrderView();
    else renderCustomTab(false);
    return;

// Le toast affiche une icône selon le type ; un éventuel emoji en tête du message est retiré.
const TOAST_EMOJI_RE = /^(?:[\u2300-\u23FF\u2600-\u27BF\u2B00-\u2BFF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|\uD83E[\uDC00-\uDFFF])[\uFE0F\u200D]*\s*/;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  const clean = String(msg).replace(TOAST_EMOJI_RE, '');
  const ic = type === 'warning' ? 'alert' : type === 'error' ? 'xCircle' : 'checkCircle';
  t.innerHTML = icon(ic) + '<span>' + escapeHtml(clean) + '</span>';
  t.style.background = type === 'warning' ? '#8a5a00' : type === 'error' ? '#c4260b' : '#006e52';
  t.classList.add('show'); clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Modale image plein écran — navigation entre les visuels d'une même commande ──
// items: [{url, title}], index: position de depart dans items.
// Retro-compatible : openImgModal('https://...') (une seule image, appel historique) marche toujours.
let imgModalItems = [];
let imgModalIndex = 0;
function openImgModal(items, index) {
  if (typeof items === 'string') { imgModalItems = [{ url: items, title: '' }]; imgModalIndex = 0; }
  else { imgModalItems = items && items.length ? items : []; imgModalIndex = index || 0; }
  renderImgModal();
  document.getElementById('img-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function renderImgModal() {
  const item = imgModalItems[imgModalIndex];
  if (!item) return;
  document.getElementById('img-modal-src').src = item.url;
  const multi = imgModalItems.length > 1;
  const caption = document.getElementById('img-modal-caption');
  caption.textContent = multi ? `${item.title || ''} — ${imgModalIndex + 1}/${imgModalItems.length}` : (item.title || '');
  document.getElementById('img-modal-prev').style.display = multi ? 'flex' : 'none';
  document.getElementById('img-modal-next').style.display = multi ? 'flex' : 'none';
}
function imgModalPrev(e) { if (e) e.stopPropagation(); if (imgModalItems.length < 2) return; imgModalIndex = (imgModalIndex - 1 + imgModalItems.length) % imgModalItems.length; renderImgModal(); }
function imgModalNext(e) { if (e) e.stopPropagation(); if (imgModalItems.length < 2) return; imgModalIndex = (imgModalIndex + 1) % imgModalItems.length; renderImgModal(); }
function closeImgModal() { document.getElementById('img-modal').classList.remove('open'); document.body.style.overflow = ''; }

// ── Popup d'alerte sur note de commande ──
function getAckedNotes() { try { return JSON.parse(localStorage.getItem('acked_notes') || '{}'); } catch(e) { return {}; } }
function isNoteAcked(order) { const acked = getAckedNotes(); return acked[order.id] === (order.note || ''); }
function ackNote(order) { const acked = getAckedNotes(); acked[order.id] = order.note || ''; try { localStorage.setItem('acked_notes', JSON.stringify(acked)); } catch(e) {} }
function showNoteModalIfNeeded(order) {
  if (!order || !order.note?.trim() || isNoteAcked(order)) { document.getElementById('note-modal').classList.remove('open'); return; }
  const noteWho = order.customer ? `${order.customer.firstName || ''} ${order.customer.lastName || ''}`.trim() : '';
  document.getElementById('note-modal-order').textContent = 'Commande ' + order.name + (noteWho ? ' \u00b7 ' + noteWho : '');
  document.getElementById('note-modal-text').textContent = order.note;
  document.getElementById('note-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  state.noteModalOrderId = order.id;
}
function acknowledgeCurrentNote() {

  if (order) ackNote(order);
  document.getElementById('note-modal').classList.remove('open');

// Ferme la modale SANS marquer la note comme acquittée — elle réapparaîtra
// la prochaine fois que cette commande sera affichée.
function dismissNoteModal() {
  document.getElementById('note-modal').classList.remove('open');

document.addEventListener('keydown', e => {
  // Le premier appui pendant la veille sert uniquement à la fermer (resetScreensaverTimer
  // s'en charge) — on ne laisse pas ce même appui déclencher un raccourci de l'appli en dessous.
  if (document.getElementById('screensaver')?.classList.contains('open')) return;
  if (document.getElementById('img-modal').classList.contains('open')) {
    if (e.key === 'Escape') { closeImgModal(); return; }
    if (e.key === 'ArrowRight' || e.key === '+') { e.preventDefault(); imgModalNext(); }
    if (e.key === 'ArrowLeft' || e.key === '-') { e.preventDefault(); imgModalPrev(); }
    return;
  }
  if (state.activeTab !== 'custom') return;
  if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (document.getElementById('note-modal')?.classList.contains('open')) return;
  const k = e.key;
  // Liste des commandes ouverte : seules Échap et / la referment
  if (document.getElementById('co-sheet')) {
    if (k === 'Escape' || k === '/') { e.preventDefault(); closeOrderSheet(); }
    return;
  }
  // Pavé numérique : chiffres = n° de commande, Entrée = ouvrir (ou commande suivante si rien tapé)
  if (/^[0-9]$/.test(k)) { e.preventDefault(); if (state.typedOrderNum.length < 6) { state.typedOrderNum += k; updateTypedUI(); } return; }
  if (k === 'Backspace' && state.typedOrderNum) { e.preventDefault(); state.typedOrderNum = state.typedOrderNum.slice(0, -1); updateTypedUI(); return; }
  if (k === 'Enter') { e.preventDefault(); if (state.typedOrderNum) searchOrderByNumber(); else nextOrderAndScroll(); return; }
  if (k === '+' || k === 'k' || k === 'ArrowRight') { e.preventDefault(); nextOrderAndScroll(); return; }
  if (k === '-' || k === 'j' || k === 'ArrowLeft') { e.preventDefault(); prevOrder(); return; }
  if (k === '*') { e.preventDefault(); setCustomFilter(!state.filterUrgent); return; }
  if (k === '/') { e.preventDefault(); openOrderSheet(); return; }
  if (k === '.' || k === ',' || e.code === 'NumpadDecimal') { e.preventDefault(); openInSendcloud(); return; }
  if (k === 'Escape') {
    if (state.typedOrderNum) { state.typedOrderNum = ''; updateTypedUI(); }
    else if (state.orderSearchActive) clearOrderSearch();
  }
});

// Balayage gauche/droite sur la commande (écran tactile)
(function () {
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => {
    if (state.activeTab !== 'custom' || e.touches.length !== 1) { x0 = null; return; }
    if (!e.target.closest('#content') || e.target.closest('#co-rail')) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (document.getElementById('img-modal').classList.contains('open') || document.getElementById('co-sheet')) return;
    if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? nextOrderAndScroll() : prevOrder(); }
  }, { passive: true });
})();

// Son « commande traitée » : l'AudioContext est débloqué au premier toucher/appui
let _audioCtx = null;
function unlockAudio() {
  try { if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (_audioCtx.state === 'suspended') _audioCtx.resume(); } catch (e) {}
}
['pointerdown', 'keydown', 'touchstart'].forEach(evt => document.addEventListener(evt, unlockAudio, { passive: true }));
function playDoneSound() {
  try {
    unlockAudio(); if (!_audioCtx) return;
    const t0 = _audioCtx.currentTime;
    [[880, 0], [1320, 0.12]].forEach(([f, dt]) => {
      const o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.35);
      o.connect(g).connect(_audioCtx.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.4);
    });
  } catch (e) {}
}

const SCREENSAVER_IDLE_MS = 5 * 60 * 1000;
const SCREENSAVER_QUOTES = [

let screensaverTimer = null, screensaverRotateTimer = null, screensaverClockTimer = null, screensaverPanelIdx = 0;

function resetScreensaverTimer() {
  const el = document.getElementById('screensaver');
  if (el && el.classList.contains('open')) closeScreensaver();
  clearTimeout(screensaverTimer);
  screensaverTimer = setTimeout(triggerScreensaver, SCREENSAVER_IDLE_MS);
}
['mousemove', 'mousedown', 'keydown', 'touchstart', 'wheel'].forEach(evt => document.addEventListener(evt, resetScreensaverTimer, { passive: true }));

async function triggerScreensaver() {
  if (!state.isLoggedIn) return;
  // Ne pas s'afficher par-dessus une modale déjà ouverte (image plein écran, note, réglages)
  if (['img-modal', 'note-modal', 'settings-modal'].some(id => document.getElementById(id)?.classList.contains('open'))) {
    screensaverTimer = setTimeout(triggerScreensaver, SCREENSAVER_IDLE_MS);
    return;
  }
  await openScreensaver();
}

async function fetchScreensaverGallery() {
  const now = Date.now();
  if (state.screensaverGalleryCache && (now - state.screensaverGalleryCacheAt) < 10 * 60 * 1000) return state.screensaverGalleryCache;
  try {
    const data = await gql(`query {
      orders(first: 12, reverse: true, sortKey: CREATED_AT, query: "tag:custom") {
        edges { node {
          lineItems(first: 5) { edges { node {
            variant { customizationImage: metafield(namespace:"teeinblue", key:"customization_image") { value } }
            customAttributes { key value }
          }}}
        }}
      }
    }`);
    const urls = [];
    for (const { node: o } of data.orders.edges) {
      for (const { node: li } of o.lineItems.edges) {
        const imgAttr = li.customAttributes.find(a => a.key === '_customization_image');
        const url = imgAttr?.value || li.variant?.customizationImage?.value || null;
        if (url) { urls.push(url); break; } // une image par commande suffit pour la mosaïque
      }
      if (urls.length >= 8) break;
    }
    state.screensaverGalleryCache = urls;
    state.screensaverGalleryCacheAt = now;
    return urls;
  } catch (e) { console.log('Erreur galerie veille:', e.message); return state.screensaverGalleryCache || []; }
}

async function buildScreensaverPanels() {
  const panels = [];

  const buckets = (state.dashboardProcessingBuckets || []).filter(b => b.count > 0);
  const lastWeek = buckets[buckets.length - 1];
  if (lastWeek) {
    const target = Number(state.delais?.delaiProduction) || null;
    const underTarget = target && lastWeek.avg !== null && lastWeek.avg <= target;
    panels.push(`
      <div class="ss-eyebrow">Cette semaine</div>
      <div class="ss-hero">${lastWeek.count}</div>
      <div class="ss-sub">commande${lastWeek.count > 1 ? 's' : ''} custom traitée${lastWeek.count > 1 ? 's' : ''} (hors rush)</div>
      ${lastWeek.avg !== null ? `<div class="ss-tag ${underTarget ? 'good' : ''}">${underTarget ? '✅' : '⏱️'} Temps moyen ${fmtJours(lastWeek.avg)}${target ? ` — cible ${target}j` : ''}</div>` : ''}
    `);
  }

  const gallery = await fetchScreensaverGallery();
  if (gallery.length) {
    panels.push(`
      <div class="ss-eyebrow">Vos créations récentes</div>
      <div class="ss-gallery">${gallery.slice(0, 8).map(u => `<div class="ss-gcell"><img src="${u}" alt="" loading="lazy"></div>`).join('')}</div>
    `);
  }

  if (Array.isArray(state.dashboardDelayAlerts) && state.dashboardDelayAlerts.length === 0) {
    panels.push(`
      <div class="ss-eyebrow">État actuel</div>
      <div class="ss-quote">✅ Aucune commande en retard actuellement</div>
    `);
  }

  const quote = SCREENSAVER_QUOTES[Math.floor(Math.random() * SCREENSAVER_QUOTES.length)];
  panels.push(`<div class="ss-quote">"${quote}"</div><div class="ss-quote-by">— L'équipe RXWEAR</div>`);

  return panels;
}

function updateScreensaverPanel() {
  document.querySelectorAll('#screensaver .ss-panel').forEach((p, i) => p.classList.toggle('active', i === screensaverPanelIdx));
  document.querySelectorAll('#screensaver .ss-dot').forEach((d, i) => d.classList.toggle('active', i === screensaverPanelIdx));
}

function startScreensaverClock() {
  const tick = () => {
    const el = document.getElementById('ss-clock');
    if (!el) return;
    const now = new Date();
    el.innerHTML = `<div class="t">${now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div><div class="d">${now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })}</div>`;
  };
  tick();
  clearInterval(screensaverClockTimer);
  screensaverClockTimer = setInterval(tick, 30000);
}

async function openScreensaver() {
  const panels = await buildScreensaverPanels();
  if (!panels.length) { screensaverTimer = setTimeout(triggerScreensaver, SCREENSAVER_IDLE_MS); return; }
  const el = document.getElementById('screensaver');
  screensaverPanelIdx = 0;
  el.innerHTML = `
    <div class="ss-brand">🎨 RXWEAR</div>
    <div class="ss-clock" id="ss-clock"></div>
    ${panels.map((html, i) => `<div class="ss-panel ${i === 0 ? 'active' : ''}">${html}</div>`).join('')}
    ${panels.length > 1 ? `<div class="ss-dots">${panels.map((_, i) => `<span class="ss-dot ${i === 0 ? 'active' : ''}"></span>`).join('')}</div>` : ''}
    <div class="ss-hint">bouge la souris ou appuie sur une touche pour revenir</div>
  `;
  el.classList.add('open');
  startScreensaverClock();
  clearInterval(screensaverRotateTimer);
  if (panels.length > 1) {
    screensaverRotateTimer = setInterval(() => {
      screensaverPanelIdx = (screensaverPanelIdx + 1) % panels.length;
      updateScreensaverPanel();
    }, 7000);
  }
}

function closeScreensaver() {
  document.getElementById('screensaver').classList.remove('open');
  clearInterval(screensaverRotateTimer);
  clearInterval(screensaverClockTimer);
}
