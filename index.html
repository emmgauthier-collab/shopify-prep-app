// CALENDRIER DE TRAITEMENT (J-15 / J+15)
// ════════════════════════════════════════════
async function fetchDashboardCalendarData() {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - 60);
  const cutoffIso = cutoff.toISOString().slice(0, 10);

  let orders = [], hasNext = true, cursor = null;
  while (hasNext) {
    const data = await gql(`query($first:Int!,$after:String,$q:String!){
      orders(first:$first, after:$after, query:$q){
        edges{node{
          id name tags
          dateLimiteTraitement: metafield(namespace:"custom", key:"date_limite_traitement"){value}
          estRush: metafield(namespace:"custom", key:"est_rush"){value}
          displayFulfillmentStatus
        }}
        pageInfo{hasNextPage endCursor}
      }
    }`, { first: 250, after: cursor, q: `tag:custom AND created_at:>'${cutoffIso}'` });
    orders.push(...data.orders.edges.map(e => e.node));
    hasNext = data.orders.pageInfo.hasNextPage; cursor = data.orders.pageInfo.endCursor;
  }

  // Regroupe par date limite de traitement (YYYY-MM-DD)
  const byDate = {};
  orders.forEach(o => {
    const raw = o.dateLimiteTraitement && o.dateLimiteTraitement.value;
    if (!raw) return;
    const dateKey = raw.slice(0, 10); // supporte date pure ou date_time ISO
    if (!byDate[dateKey]) byDate[dateKey] = [];
    byDate[dateKey].push({
      id: o.id,
      name: o.name,
      fulfilled: o.displayFulfillmentStatus === 'FULFILLED',
      rush: o.estRush && o.estRush.value === 'true'
    });
  });
  return byDate;
}

function renderDashboardCalendar() {
  const byDate = state.dashboardCalendarData || {};
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = [];
  for (let offset = 0; offset <= 15; offset++) {
    const d = new Date(today);
    d.setDate(d.getDate() + offset);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayOrders = byDate[key] || [];
    const total = dayOrders.length;
    const pendingOrders = dayOrders.filter(o => !o.fulfilled);
    const pendingCount = pendingOrders.length;
    const doneCount = total - pendingCount;
    const rushPending = pendingOrders.some(o => o.rush);
    // Ici offset >= 0 toujours (plus de jours passés), donc "en retard" ne s'applique qu'au jour même (offset 0)
    const isOverdue = offset === 0;

    let ringColor = 'var(--border)';
    if (total > 0 && pendingCount > 0) ringColor = (rushPending || isOverdue) ? 'var(--critical)' : 'var(--warning)';

    days.push({
      key, dayNum: d.getDate(), isToday: offset === 0, isFirst: offset === 0,
      total, pendingCount, doneCount, ringColor,
      monthLabel: d.toLocaleDateString('fr-FR', { month: 'short' }),
      weekdayLabel: d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''),
      longLabel: d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })
    });
  }

  const cellsHtml = days.map(d => {
    const doneRatio = d.total > 0 ? (d.doneCount / d.total) : 0;
    const bigLabel = d.total === 0 ? '' : (d.pendingCount === 0 ? icon('check') : d.pendingCount);
    const bigColor = d.total === 0 ? 'var(--text-sub)' : (d.pendingCount === 0 ? 'var(--success)' : 'var(--text)');
    const tooltip = d.total === 0 ? 'Aucune commande' : `${d.pendingCount} à traiter sur ${d.total}${d.doneCount > 0 ? ` (${d.doneCount} déjà traitée${d.doneCount>1?'s':''})` : ''}`;
    const selected = state.calendarSelectedDay === d.key;
    return `<button type="button" class="cal-day${d.isToday ? ' today' : ''}${selected ? ' selected' : ''}" style="--ring:${d.ringColor}"
      onclick="showCalendarDayOrders('${d.key}')" title="${escapeHtml(tooltip)}" aria-label="${escapeHtml(d.longLabel + ' : ' + tooltip)}" aria-pressed="${selected}">
      <span class="m">${d.isFirst || d.dayNum === 1 ? d.monthLabel : ''}</span>
      <span class="w">${d.weekdayLabel}</span>
      <span class="d">${d.dayNum}</span>
      <span class="n" style="color:${bigColor}">${bigLabel}</span>
      <span class="bar"><span style="width:${Math.round(doneRatio*100)}%"></span></span>
    </button>`;
  }).join('');

  return `<div class="card">
    <div class="card-title">${icon('calendar')} Calendrier de traitement <span class="muted" style="font-weight:400;">aujourd'hui + 15 jours</span></div>
    <div class="card-desc">Le chiffre = commandes <strong>restant à traiter</strong> ce jour-là. Clique sur un jour pour voir les commandes.</div>
    <div class="cal-legend">
      <span><i style="--sw:var(--border)"></i> Rien à traiter</span>
      <span><i style="--sw:var(--warning)"></i> En attente</span>
      <span><i style="--sw:var(--critical)"></i> En retard ou rush</span>
    </div>
    <div class="cal-strip">${cellsHtml}</div>
    <div id="calendar-day-detail"></div>
  </div>`;
}

function showCalendarDayOrders(dateKey) {
  const byDate = state.dashboardCalendarData || {};
  const orders = byDate[dateKey] || [];
  const zone = document.getElementById('calendar-day-detail');
  if (!zone) return;
  const setPressed = () => document.querySelectorAll('.cal-day').forEach(b => {
    const on = (b.getAttribute('onclick') || '').indexOf(`'${state.calendarSelectedDay}'`) > -1;
    b.classList.toggle('selected', on); b.setAttribute('aria-pressed', on);
  });
  if (state.calendarSelectedDay === dateKey) { state.calendarSelectedDay = null; zone.innerHTML = ''; setPressed(); return; }
  state.calendarSelectedDay = dateKey;
  setPressed();
  const d = new Date(dateKey + 'T00:00:00');
  const dateFr = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  if (!orders.length) {
    zone.innerHTML = `<div class="cal-detail"><div class="empty-inline">Aucune commande avec échéance le ${dateFr}.</div></div>`;
    return;
  }
  zone.innerHTML = `<div class="cal-detail">
    <strong style="text-transform:capitalize;">${dateFr}</strong> <span class="muted">— ${orders.length} commande${orders.length>1?'s':''}</span>
    <div class="badges">
      ${orders.map(o => `<span class="badge ${o.fulfilled ? 'badge-success' : (o.rush ? 'badge-critical' : 'badge-warning')}">${icon(o.fulfilled ? 'check' : (o.rush ? 'zap' : 'clock'))}${escapeHtml(o.name)}</span>`).join('')}
    </div>
  </div>`;
}


// ════════════════════════════════════════════
// ALERTES DE RETARD (fournisseur / impression)
// ════════════════════════════════════════════
async function fetchDelayAlerts() {
  let orders = [], hasNext = true, cursor = null;
  const data0 = await gql(`query{
    shop{
      alerteImpression: metafield(namespace:"custom", key:"alerte_delai_impression"){value}
      alerteFournisseur: metafield(namespace:"custom", key:"alerte_delai_fournisseur"){value}
    }
  }`);
  const seuilImpression = data0.shop.alerteImpression ? parseFloat(data0.shop.alerteImpression.value) : 1;
  const seuilFournisseur = data0.shop.alerteFournisseur ? parseFloat(data0.shop.alerteFournisseur.value) : 2;

  while (hasNext) {
    const data = await gql(`query($first:Int!,$after:String,$q:String!){
      orders(first:$first, after:$after, query:$q){
        edges{node{
          id name tags
          dateLimiteTraitement: metafield(namespace:"custom", key:"date_limite_traitement"){value}
          estRush: metafield(namespace:"custom", key:"est_rush"){value}
        }}
        pageInfo{hasNextPage endCursor}
      }
    }`, { first: 100, after: cursor, q: 'tag:custom AND status:open AND (fulfillment_status:unshipped OR fulfillment_status:partial)' });
    orders.push(...data.orders.edges.map(e => e.node));
    hasNext = data.orders.pageInfo.hasNextPage; cursor = data.orders.pageInfo.endCursor;
  }

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const alerts = [];
  orders.forEach(o => {
    const raw = o.dateLimiteTraitement && o.dateLimiteTraitement.value;
    if (!raw) return;
    const deadline = new Date(raw.slice(0, 10) + 'T00:00:00');
    const daysRemaining = (deadline - today) / 86400000;
    const isRush = o.estRush && o.estRush.value === 'true';
    const isToOrder = o.tags.includes('TOORDER');
    const isToPrint = o.tags.includes('TODOPRINT');
    const stages = [];
    if (isToPrint && daysRemaining <= seuilImpression) stages.push('impression');
    if (isToOrder && daysRemaining <= seuilFournisseur) stages.push('fournisseur');
    // Commande qui a déjà quitté les étapes fournisseur/impression (plus de tag
    // TOORDER ni TODOPRINT) mais toujours pas expédiée après son échéance :
    // retard générique, probablement bloquée en préparation/expédition —
    // avant cet ajout, ces commandes ne déclenchaient plus aucune alerte.
    if (!isToOrder && !isToPrint && daysRemaining <= 0) stages.push('traitement');
    if (stages.length) alerts.push({ id: o.id, name: o.name, daysRemaining, isRush, stages });
  });
  alerts.sort((a, b) => a.daysRemaining - b.daysRemaining);
  return alerts;
}


// ════════════════════════════════════════════
// TEMPS DE TRAITEMENT MOYEN (hors rush)
// ════════════════════════════════════════════
// Mêmes règles de jours ouvrés que lib/delaiCalc.js côté serveur (fuseau
// boutique, week-ends + périodes de fermeture), mais ici on compte les jours
// ouvrés écoulés ENTRE deux dates au lieu d'en ajouter à partir d'une seule.
const SHOP_TZ_DASH = 'Europe/Paris';
function shopDateStrDash(date) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: SHOP_TZ_DASH, year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
}
function shopDowDash(date) {
  const map = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 7 };
  return map[new Intl.DateTimeFormat('en-US', { timeZone: SHOP_TZ_DASH, weekday: 'short' }).format(date)];
}
function countBusinessDaysBetween(fromDate, toDate, periodes) {
  const toStr = shopDateStrDash(toDate);
  if (toStr <= shopDateStrDash(fromDate)) return 0;
  let compte = 0;
  let cursor = new Date(fromDate.getTime());
  for (let i = 0; i < 400; i++) {
    cursor = new Date(cursor.getTime() + 86400000);
    const dateStr = shopDateStrDash(cursor);
    if (dateStr > toStr) break;
    const dow = shopDowDash(cursor);
    const isWeekend = dow === 6 || dow === 7;
    const closed = !isWeekend && (periodes || []).some(p => dateStr >= p.debut && dateStr <= p.fin);
    if (!isWeekend && !closed) compte++;
  }
  return compte;
}

// Récupère les commandes custom expédiées (hors rush) des ~60 derniers jours,
// calcule pour chacune le temps réel (création → expédition) en jours ouvrés,
// et fait la moyenne sur les 7 et les 30 plus récemment expédiées.
// Lundi (fuseau boutique) de la semaine calendaire contenant `date`, en YYYY-MM-DD.
function shopWeekStartStr(date) {
  const dateStr = shopDateStrDash(date);
  const dow = shopDowDash(date); // 1=lundi..7=dimanche
  const d = new Date(dateStr + 'T12:00:00Z'); // midi UTC : pas d'ambiguïté DST sur un simple calcul de calendrier
  d.setUTCDate(d.getUTCDate() - (dow - 1));
  return d.toISOString().slice(0, 10);
}

// Commandes custom expédiées (hors rush) groupées par semaine calendaire (lundi->dimanche,
// fuseau boutique) sur les WEEKS dernières semaines — la plus récente étant en cours.
async function fetchProcessingTimeWeekly() {
  const WEEKS = 9; // ~2 mois pleins + la semaine en cours
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - (WEEKS * 7 + 7));
  const cutoffIso = cutoff.toISOString().slice(0, 10);

  let orders = [], hasNext = true, cursor = null;
  while (hasNext) {
    const data = await gql(`query($first:Int!,$after:String,$q:String!){
      orders(first:$first, after:$after, query:$q){
        edges{node{
          id name createdAt
          estRush: metafield(namespace:"custom", key:"est_rush"){value}
          fulfillments(first:5){createdAt}
        }}
        pageInfo{hasNextPage endCursor}
      }
    }`, { first: 250, after: cursor, q: `tag:custom AND fulfillment_status:fulfilled AND created_at:>'${cutoffIso}'` });
    orders.push(...data.orders.edges.map(e => e.node));
    hasNext = data.orders.pageInfo.hasNextPage; cursor = data.orders.pageInfo.endCursor;
  }

  const periodes = (state.delais && state.delais.periodes) || [];
  const perOrder = orders
    .filter(o => !(o.estRush && o.estRush.value === 'true'))
    .map(o => {
      const shipTimes = (o.fulfillments || []).map(f => new Date(f.createdAt).getTime()).filter(t => !isNaN(t));
      if (!shipTimes.length) return null;
      const shipDate = new Date(Math.max(...shipTimes));
      const createdDate = new Date(o.createdAt);
      return { weekStart: shopWeekStartStr(shipDate), joursOuvres: countBusinessDaysBetween(createdDate, shipDate, periodes) };
    })
    .filter(Boolean);

  const weekKeys = [];
  let wCursor = new Date(shopWeekStartStr(new Date()) + 'T12:00:00Z');
  for (let i = 0; i < WEEKS; i++) {
    weekKeys.unshift(wCursor.toISOString().slice(0, 10));
    wCursor.setUTCDate(wCursor.getUTCDate() - 7);
  }

  return weekKeys.map(weekStart => {
    const rows = perOrder.filter(r => r.weekStart === weekStart);
    const avg = rows.length ? rows.reduce((s, r) => s + r.joursOuvres, 0) / rows.length : null;
    return { weekStart, avg, count: rows.length };
  });
}

function fmtJours(v) { return (v === null || v === undefined) ? '—' : (Math.round(v * 10) / 10).toString().replace('.', ',') + 'j'; }
function fmtWeekLabel(weekStart) {
  return new Date(weekStart + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
}

// Graphique en ligne (SVG, sans dépendance) : temps de traitement moyen par
// semaine, hors rush, sur les ~2 derniers mois. Un point par semaine ; les
// semaines sans commande expédiée cassent la ligne plutôt que d'afficher un
// faux 0. Voir aussi le bouton "Voir en tableau" pour l'équivalent accessible.
function renderProcessingTimeChart(buckets) {
  if (!buckets || !buckets.length) {
    return `<div class="card"><div class="card-title">${icon('activity')} Temps de traitement moyen (hors rush)</div><div class="empty-inline">Pas assez de données pour le moment.</div></div>`;
  }
  const target = state.delais && state.delais.delaiProduction ? parseFloat(state.delais.delaiProduction) : null;
  const values = buckets.map(b => b.avg).filter(v => v !== null && v !== undefined);
  const maxVal = Math.max(target || 0, values.length ? Math.max(...values) : 0);
  const yMax = maxVal > 0 ? Math.ceil(maxVal * 1.2) : 1;

  const W = 640, H = 210, padL = 32, padR = 16, padT = 16, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const stepX = buckets.length > 1 ? plotW / (buckets.length - 1) : 0;
  const xAt = i => padL + i * stepX;
  const yAt = v => padT + plotH - (v / yMax) * plotH;

  // Segments continus : une rupture de ligne à chaque semaine sans donnée.
  let segments = [], current = [];
  buckets.forEach((b, i) => {
    if (b.avg === null || b.avg === undefined) { if (current.length) { segments.push(current); current = []; } return; }
    current.push({ x: xAt(i), y: yAt(b.avg) });
  });
  if (current.length) segments.push(current);
  const pathD = segments.map(seg => 'M ' + seg.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ')).join(' ');

  const gridVals = Array.from(new Set(target ? [0, target, yMax] : [0, yMax]));
  const gridLines = gridVals.map(v => `<line x1="${padL}" y1="${yAt(v).toFixed(1)}" x2="${W - padR}" y2="${yAt(v).toFixed(1)}" stroke="var(--border)" stroke-width="1"/>` +
    `<text x="${padL - 6}" y="${(yAt(v) + 3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-sub)">${v}j</text>`).join('');

  const targetLine = target ? `
    <line x1="${padL}" y1="${yAt(target).toFixed(1)}" x2="${W - padR}" y2="${yAt(target).toFixed(1)}" stroke="var(--text-sub)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="${W - padR}" y="${(yAt(target) - 5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-sub)">cible ${target}j</text>` : '';

  const xLabels = buckets.map((b, i) => `<text x="${xAt(i).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle" font-size="10" fill="var(--text-sub)">${fmtWeekLabel(b.weekStart)}</text>`).join('');

  const points = buckets.map((b, i) => {
    const x = xAt(i);
    const hasData = b.avg !== null && b.avg !== undefined;
    const isLast = i === buckets.length - 1;
    const y = hasData ? yAt(b.avg) : (padT + plotH);
    const label = hasData
      ? `Semaine du ${fmtWeekLabel(b.weekStart)}${isLast ? ' (en cours)' : ''} — ${fmtJours(b.avg)} ouvrés (${b.count} commande${b.count > 1 ? 's' : ''})`
      : `Semaine du ${fmtWeekLabel(b.weekStart)} — aucune commande expédiée`;
    // Semaine sans donnée : un petit repère creux sur l'axe plutôt que rien,
    // pour que le trou dans la ligne se lise comme "vérifié, zéro commande"
    // et non comme un problème d'affichage.
    const dot = hasData
      ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="var(--primary)" stroke="var(--surface)" stroke-width="2"/>`
      : `<circle cx="${x.toFixed(1)}" cy="${(padT + plotH).toFixed(1)}" r="3" fill="var(--surface)" stroke="var(--text-sub)" stroke-width="1.5"/>`;
    const endLabel = (hasData && isLast) ? `<text x="${x.toFixed(1)}" y="${(y - 12).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--primary)">${fmtJours(b.avg)}</text>` : '';
    return `${dot}${endLabel}<circle class="pt-hit" data-label="${escapeHtml(label)}" cx="${x.toFixed(1)}" cy="${(hasData ? y : padT + plotH / 2).toFixed(1)}" r="14" fill="transparent" tabindex="0" aria-label="${escapeHtml(label)}"/>`;
  }).join('');

  return `<div class="card">
    <div class="card-head">
      <div class="card-title">${icon('activity')} Temps de traitement moyen (hors rush)</div>
      <div class="card-actions"><button class="btn btn-sm" id="proc-table-btn" onclick="toggleProcTable()" aria-expanded="false">${icon('table')}Voir en tableau</button></div>
    </div>
    <div class="card-desc">De la création à l'expédition, en jours ouvrés — moyenne par semaine sur les 2 derniers mois${target ? ` (cible actuelle : ${target}j)` : ''}. Commandes rush exclues, dernière semaine possiblement partielle.</div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temps de traitement moyen par semaine, hors rush, sur les deux derniers mois">
        ${gridLines}${targetLine}
        <path d="${pathD}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${points}${xLabels}
      </svg>
      <div id="proc-chart-tooltip" class="chart-tip"></div>
    </div>
    <div id="proc-chart-table" style="display:none;overflow-x:auto;">
      <table class="data-table">
        <thead><tr><th>Semaine du</th><th>Moyenne (j ouvrés)</th><th>Commandes expédiées</th></tr></thead>

function showProcTooltip(hitEl) {
  const tip = document.getElementById('proc-chart-tooltip');
  if (!tip) return;
  tip.textContent = hitEl.getAttribute('data-label') || '';

  tip.style.left = (rect.left + rect.width / 2) + 'px';

  tip.style.transform = 'translate(-50%, -100%)';

function renderDelayAlertBanner(alerts) {
  if (!alerts || !alerts.length) return '';
  const STAGE = {
    impression: { ic: 'printer', label: 'Impression', tab: 'print' },
    fournisseur: { ic: 'package', label: 'Fournisseur', tab: 'supplier' },
    traitement: { ic: 'truck', label: 'Expédition', tab: 'custom' },
  };
  const rows = alerts.map(a => {
    const label = a.daysRemaining < 0
      ? `en retard de ${Math.abs(Math.round(a.daysRemaining))}j`
      : (a.daysRemaining < 1 ? "aujourd'hui" : `dans ${Math.ceil(a.daysRemaining)}j`);

    const stageBadges = a.stages.map(s => `<span class="badge badge-critical">${icon(STAGE[s].ic)}${STAGE[s].label}</span>`).join('');

// ════════════════════════════════════════════
// CUSTOM ORDERS
// ════════════════════════════════════════════
const ORDER_FIELDS = `id name createdAt note tags customer { firstName lastName }
  displayFulfillmentStatus cancelledAt
  fulfillments(first: 5) { createdAt trackingInfo(first: 1) { number url } }
  dateLimiteTraitement: metafield(namespace: "custom", key: "date_limite_traitement") { value }
  estRush: metafield(namespace: "custom", key: "est_rush") { value }
  lineItems(first: 250) { edges { node { id title quantity currentQuantity requiresShipping
    variant { title
      customizationImage: metafield(namespace: "teeinblue", key: "customization_image") { value }
      imbretexSku: metafield(namespace: "custom", key: "imbretex_sku") { value }
    }
    customAttributes { key value }
  }}}`;

// Ne garde que les lignes de commande encore actives : `quantity` inclut les unités
// remboursées/retirées, alors que `currentQuantity` les exclut. Un produit annulé
// (édition de commande, remboursement) a currentQuantity = 0 et ne doit apparaître
// nulle part dans l'app (préparation, export fournisseur, impression).
function activeLineItemEdges(order) {
  return (order.lineItems?.edges || []).filter(({ node: li }) => li.currentQuantity > 0);
}

// Trie par "à traiter avant" (date_limite_traitement) croissant : l'échéance la plus proche en premier.
// Les commandes sans échéance connue (webhook pas encore passé dessus) sont reléguées en fin de liste,
// triées par ancienneté (les plus vieilles d'abord) pour ne pas les perdre de vue.
function sortOrdersByDeadline(orders) {
  return orders.slice().sort((a, b) => {
    const da = a.dateLimiteTraitement?.value || null;
    const db = b.dateLimiteTraitement?.value || null;
    if (da && db) return da < db ? -1 : da > db ? 1 : 0;
    if (da && !db) return -1;
    if (!da && db) return 1;
    return new Date(a.createdAt) - new Date(b.createdAt);
  });
}

async function fetchCustomOrders(urgent = false) {
  const base = 'tag:custom AND status:open AND (fulfillment_status:unshipped OR fulfillment_status:partial)';
  const q = urgent ? `${base} AND tag:urgent` : base;
  let orders = [], hasNext = true, cursor = null;
  while (hasNext) {
    const data = await gql(`query($first: Int!, $after: String, $q: String!) {
      orders(first: $first, after: $after, query: $q) {
        edges { node { ${ORDER_FIELDS} } }
        pageInfo { hasNextPage endCursor }
      }
    }`, { first: 250, after: cursor, q });
    orders.push(...data.orders.edges.map(e => e.node));
    hasNext = data.orders.pageInfo.hasNextPage;
    cursor = data.orders.pageInfo.endCursor;
  }
  state.orders = sortOrdersByDeadline(orders);
  state.currentIndex = 0;
  // Liste rechargée = plus de recherche en cours (sinon le n° cherché et le ✕ restaient affichés)
  state.orderSearchActive = false; state.orderSearchQuery = '';
  refreshCustomCounts();
}

function isUrgentOrder(o) { return (o.tags || []).some(t => t.toLowerCase() === 'urgent'); }
function refreshCustomCounts() {
  if (state.orderSearchActive) return;
  if (state.filterUrgent) state.customCounts.urgent = state.orders.length;
  else state.customCounts = { all: state.orders.length, urgent: state.orders.filter(isUrgentOrder).length };
}

}

function getOrderStatusBadges(tags) {
  const badges = [];

  // ── Statut impression ──
  const printTag = tags.find(t => /^print_\d{8}$/.test(t));
  if (printTag) {
    const d = printTag.replace('print_','');
    badges.push({ label: `Imprimé le ${d.slice(6,8)}/${d.slice(4,6)}/${d.slice(0,4)}`, tone: 'success', icon: 'check' });
  } else if (tags.includes('TODOPRINT')) {
    badges.push({ label: 'Impression à lancer', tone: 'warning', icon: 'printer' });
  }

  // ── Statut commande fournisseur ──
  const orderTag = tags.find(t => /^order_\d{8}$/.test(t));
  if (orderTag) {
    const d = orderTag.replace('order_','');
    badges.push({ label: `Textile commandé le ${d.slice(6,8)}/${d.slice(4,6)}/${d.slice(0,4)}`, tone: 'info', icon: 'box' });
  } else if (tags.includes('TOORDER')) {
    badges.push({ label: 'Textile à commander', tone: 'warning', icon: 'clock' });
  }

  // Si aucun statut
  if (badges.length === 0) badges.push({ label: 'Nouvelle commande', tone: 'info', icon: 'star' });

  return badges;
}

// Titre court pour la préparation : retire la parenthèse « (Compétition de type …) »
// des produits compétition. Les autres parenthèses éventuelles sont conservées.
function shortProductTitle(title) {
  return String(title || '').replace(/\s*\([^)]*comp[ée]tition[^)]*\)/gi, '').trim();
}
// Lignes sans expédition (frais de réimpression, etc.) : rien à préparer physiquement.
function isPhysicalLine(li) { return li.requiresShipping !== false; }

// Statut « déjà traitée » d'une commande : expédiée (totalement / partiellement) ou annulée.
// Renvoie null pour une commande encore à préparer.
function orderShipState(order) {
  if (!order) return null;
  const fmt = iso => new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  if (order.cancelledAt) return { kind: 'cancelled', pill: 'ANNUL\u00c9E', title: `Annul\u00e9e le ${fmt(order.cancelledAt)}`, sub: '' };
  const st = order.displayFulfillmentStatus;
  if (st !== 'FULFILLED' && st !== 'PARTIALLY_FULFILLED') return null;
  const fs = (order.fulfillments || []).filter(f => f.createdAt).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const last = fs[0];
  const tr = last && last.trackingInfo && last.trackingInfo[0];
  const sub = tr && tr.number
    ? (tr.url ? `suivi <a href="${escapeHtml(tr.url)}" target="_blank" rel="noopener" style="color:inherit;">${escapeHtml(tr.number)}</a>` : `suivi ${escapeHtml(tr.number)}`)
    : '';
  const partial = st === 'PARTIALLY_FULFILLED';
  return { kind: 'shipped', pill: partial ? 'EXP\u00c9DI\u00c9E EN PARTIE' : 'EXP\u00c9DI\u00c9E',
    title: (partial ? 'Exp\u00e9di\u00e9e en partie' : 'Exp\u00e9di\u00e9e') + (last ? ` le ${fmt(last.createdAt)}` : ''), sub };
}

function renderOrderView() {
  const c = document.getElementById('content');
  c.classList.add('has-rail'); document.body.classList.add('rail-mode');
  const order = state.orders[state.currentIndex] || null;
  const hasPrev = state.currentIndex > 0;
  const hasNext = state.currentIndex < state.orders.length - 1;
  const cnt = state.customCounts || {};
  const allCount = cnt.all ?? (state.filterUrgent || state.orderSearchActive ? '…' : state.orders.length);
  const urgCount = cnt.urgent ?? '…';
  const listLabel = state.filterUrgent ? 'urgentes' : 'commandes';

  let html = `<div class="co-top">
    <div class="co-filter" role="group" aria-label="Filtre">
      <button class="${!state.orderSearchActive && !state.filterUrgent ? 'on' : ''}" onclick="setCustomFilter(false)">Toutes <span class="n">${allCount}</span></button>
      <button class="urg ${!state.orderSearchActive && state.filterUrgent ? 'on' : ''}" onclick="setCustomFilter(true)">Urgentes <span class="n">${urgCount}</span></button>
    </div>
    <div class="co-search" id="co-search">
      <span class="hash">#</span><span class="val" id="co-typed"></span>
      <button class="clr" id="co-typed-clear" onclick="state.typedOrderNum='';updateTypedUI()">Effacer</button>
      <button class="go" id="co-typed-go" onclick="searchOrderByNumber()">Ouvrir ↵</button>
    </div>
  </div>`;
  if (state.orderSearchActive) {
    html += `<div class="co-banner"><span>Recherche <strong>#${escapeHtml(state.orderSearchQuery)}</strong> — ${state.orders.length} commande${state.orders.length > 1 ? 's' : ''} trouvée${state.orders.length > 1 ? 's' : ''}</span>
      <button onclick="clearOrderSearch()">← Retour aux ${listLabel} <kbd style="margin-left:6px">Échap</kbd></button></div>`;
  }
  const nextName = hasNext ? state.orders[state.currentIndex + 1].name : '';
  html += `<div id="co-rail">
    <div class="co-counter"><b>${state.orders.length ? state.currentIndex + 1 : 0}</b><small>sur ${state.orders.length}</small></div>
    <button class="co-next" onclick="nextOrderAndScroll()" ${!hasNext ? 'disabled' : ''}><span class="arrow">${ICO.next}</span><span>Suivante</span>${nextName ? `<small>${escapeHtml(nextName)}</small>` : ''}<kbd>+</kbd></button>
    <button class="co-ship" onclick="openInSendcloud()" ${!order ? 'disabled' : ''}>${ICO.box} Expédier <kbd>.</kbd></button>
    <button class="co-prev" onclick="prevOrder()" ${!hasPrev ? 'disabled' : ''}><span class="co-lbl">${ICO.prev} Précédente</span><kbd>−</kbd></button>
    <button class="co-list" onclick="openOrderSheet()" ${!state.orders.length ? 'disabled' : ''}>${ICO.list} Liste <kbd>/</kbd></button>
  </div>`;

  if (!state.orders.length) { html += `<div class="empty">${state.filterUrgent ? 'Aucune commande urgente.' : 'Aucune commande custom à traiter.'}</div>`; c.innerHTML = html; updateTypedUI(); return; }
  if (!order) { c.innerHTML = html; updateTypedUI(); return; }

  showNoteModalIfNeeded(order);

  const isUrgent = order.tags.some(t => t.toLowerCase() === 'urgent');
  const hasNote = !!(order.note?.trim());
  const customerName = order.customer ? `${order.customer.firstName||''} ${order.customer.lastName||''}`.trim() : '';
  const orderDate = new Date(order.createdAt).toLocaleDateString('fr-FR');
  const activeItems = activeLineItemEdges(order);
  const totalQty = activeItems.reduce((s,{node:li}) => s+li.currentQuantity, 0);
  const ageInDays = Math.floor((Date.now() - new Date(order.createdAt).getTime()) / 86400000);
  const ageTone = ageInDays < 5 ? 'success' : ageInDays <= 10 ? 'warning' : 'critical';
  const ageLabel = ageInDays < 5 ? 'Récente' : ageInDays <= 10 ? 'En retard' : 'Critique';
  const physicalItems = activeItems.filter(({node:li}) => isPhysicalLine(li));
  const prepItems = physicalItems.map(({node:li}) => {
    const v = li.variant?.title; const sv = v && v!=='Default Title';
    return `<span class="prep-item"><strong>${li.currentQuantity}×</strong> ${shortProductTitle(li.title)}${sv?` — ${v}`:''}</span>`;
  }).join('');

  // ── Délai de traitement (rempli par le webhook order-delai-webhook) ──
  let delaiBlock = '';
  if (order.dateLimiteTraitement?.value) {
    const dateLimite = new Date(order.dateLimiteTraitement.value + 'T00:00:00');
    const joursRestants = Math.ceil((dateLimite.getTime() - Date.now()) / 86400000);
    const delaiTone = joursRestants < 0 ? 'critical' : joursRestants <= 2 ? 'warning' : 'info';
    const dateLabel = dateLimite.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
    const joursLabel = joursRestants < 0 ? `en retard de ${Math.abs(joursRestants)} j` : joursRestants === 0 ? "aujourd\u2019hui" : `dans ${joursRestants} jour${joursRestants > 1 ? 's' : ''}`;
    delaiBlock = `<div class="co-deadline tone-${delaiTone}">${ICO.clock}<b>Avant le ${dateLabel}</b><span>\u00b7 ${joursLabel}</span></div>`;
  }
  const estRushBadge = order.estRush?.value === 'true' ? `<span class="pill pill-rush">${ICO.bolt}RUSH</span>` : '';

  // ── Commande déjà traitée (ouverte via la recherche) : expédiée ou annulée ──
  const shipState = orderShipState(order);
  let shipPill = '';
  if (shipState) {
    shipPill = `<span class="pill ${shipState.kind === 'cancelled' ? 'pill-cancelled' : 'pill-shipped'}">${shipState.kind === 'cancelled' ? ICO.alert : ICO.check}${shipState.pill}</span>`;
    // Le délai n'a plus de sens (« en retard » serait faux) : on le remplace par le statut
    delaiBlock = `<div class="co-deadline tone-${shipState.kind === 'cancelled' ? 'info' : 'success'}">${shipState.kind === 'cancelled' ? ICO.alert : ICO.box}<b>${shipState.title}</b>${shipState.sub ? `<span>\u00b7 ${shipState.sub}</span>` : ''}</div>`;
  }

  html += `<div id="order-sticky">
    <div class="order-sticky-top">
      <h2>${order.name}</h2>
      ${shipPill}
      ${isUrgent && !shipState ? `<span class="pill pill-urgent">${ICO.alert}URGENT</span>` : ''}
      ${estRushBadge}
      ${renderStatusBadges(order.tags)}
      <a href="https://therxshop.myshopify.com/admin/orders/${order.id.split('/').pop()}" target="_blank" class="co-shopify">${ICO.ext}Voir dans Shopify</a>
    </div>
    <div class="co-info-row">
      ${delaiBlock}
      <dl class="co-meta">
        <div><dt>Client</dt><dd>${escapeHtml(customerName || '-')}</dd></div>
        <div><dt>Passée le</dt><dd>${orderDate}</dd></div>
        <div><dt>Âge</dt>${delaiBlock ? `<dd>${ageInDays} j</dd>` : `<dd class="tone-${ageTone}">${ageInDays} j<small>${ageLabel}</small></dd>`}</div>
      </dl>
    </div>
    ${hasNote ? `<div class="co-note">${ICO.note}<div><strong>Note client : </strong><span class="alert-text">${order.note}</span></div></div>` : ''}
    <div class="prep-list"><span class="prep-label">${shipState ? 'Contenu' : 'À préparer'}</span>${prepItems}</div>
  </div>
  <div style="margin-top:12px;display:flex;flex-direction:column;gap:12px;">`;

  // Tous les visuels de la commande, dans l'ordre d'affichage — sert à la navigation
  // ‹ › dans la modale plein écran (on peut ainsi passer d'un produit à l'autre
  // sans repasser par la liste).
  state.currentOrderImgItems = activeItems
    .map(({node:li}) => {
      const imgAttr = li.customAttributes.find(a => a.key === '_customization_image');
      const teeinblue = li.variant?.customizationImage?.value || null;
      const url = imgAttr?.value || teeinblue || null;
      if (!url) return null;
      const variant = li.variant?.title;
      const showVariant = variant && variant !== 'Default Title';
      return { url, title: li.title + (showVariant ? ` — ${variant}` : '') };
    })
    .filter(Boolean);

  let imgItemIndex = -1;
  for (const {node:li} of activeItems) {
    if (!isPhysicalLine(li)) continue;
    const variant = li.variant?.title || '';
    const showVariant = variant && variant !== 'Default Title';
    const imgAttr = li.customAttributes.find(a => a.key === '_customization_image');
    const teeinblue = li.variant?.customizationImage?.value || null;
    const imageUrl = imgAttr?.value || teeinblue || null;
    const sku = li.variant?.imbretexSku?.value || null;
    const visibleAttrs = li.customAttributes.filter(a => !HIDDEN_KEYS.includes(a.key));
    const linkAttrs = visibleAttrs.filter(a => /^https?:\/\//i.test(String(a.value).trim()));
    const textAttrs = visibleAttrs.filter(a => !linkAttrs.includes(a));
    if (imageUrl) imgItemIndex++;
    html += `<div class="card co-item"><div class="lineitem-grid">
      <div class="qty-cell"><div class="qty-num">${li.currentQuantity}</div><div class="qty-label">Qté</div></div>
      <div>
        <div class="product-title">${shortProductTitle(li.title)}</div>
        ${showVariant ? renderVariantBig(variant) : ''}
        ${sku ? `<div class="product-sku">SKU: ${sku}</div>` : ''}
        ${textAttrs.length ? `<dl class="perso-list">${textAttrs.map(a => `<dt>${escapeHtml(a.key.replace(/\s*:\s*$/, ''))}</dt><dd>${escapeHtml(a.value)}</dd>`).join('')}</dl>` : ''}
        ${(linkAttrs.length || imageUrl) ? `<details class="raw-links"><summary>${ICO.link}Liens photo &amp; téléchargement</summary>
          ${linkAttrs.map(a => `<div>${escapeHtml(a.key)} : ${escapeHtml(a.value)}</div>`).join('')}
          ${imageUrl ? `<a href="${imageUrl}" class="dl-discreet" target="_blank" download>⬇ Télécharger l'image</a>` : ''}
        </details>` : ''}
      </div>
      <div class="img-cell">${imageUrl ? `<img src="${imageUrl}" alt="${li.title}" onclick="openImgModal(state.currentOrderImgItems, ${imgItemIndex})" loading="lazy"/>` : ''}</div>
    </div></div>`;
  }
  html += `</div>`;
  html += `<div class="co-keys"><span><kbd>0-9</kbd>n° de commande</span><span><kbd>Entrée</kbd>ouvrir / suivante</span><span><kbd>+</kbd>suivante</span><span><kbd>−</kbd>précédente</span><span><kbd>*</kbd>urgentes / toutes</span><span><kbd>/</kbd>liste</span><span><kbd>.</kbd>Sendcloud</span><span><kbd>Échap</kbd>annuler</span></div>`;
  c.innerHTML = html;
  updateTypedUI();
}

function renderVariantBig(variant) {
  const parts = String(variant).split(' / ');
  if (parts.length < 2) return `<div class="variant-big">${escapeHtml(variant)}</div>`;
  return `<div class="variant-big"><span class="size-chip">${escapeHtml(parts[0])}</span>${escapeHtml(parts.slice(1).join(' / '))}</div>`;
}

function updateTypedUI() {
  const v = state.typedOrderNum || '';
  const el = document.getElementById('co-typed'); if (!el) return;
  el.textContent = v;
  document.getElementById('co-search')?.classList.toggle('typing', !!v);
  const go = document.getElementById('co-typed-go'); if (go) go.disabled = !v;
  const clr = document.getElementById('co-typed-clear'); if (clr) clr.hidden = !v;
}

function openOrderSheet() {
  if (!state.orders.length) return;
  closeOrderSheet();
  const d = document.createElement('div'); d.id = 'co-sheet';
  d.addEventListener('click', ev => { if (ev.target === d) closeOrderSheet(); });
  const rows = state.orders.map((o, i) => {
    const note = !!(o.note?.trim());
    let dl = '';
    if (o.dateLimiteTraitement?.value) {
      const j = Math.ceil((new Date(o.dateLimiteTraitement.value + 'T00:00:00').getTime() - Date.now()) / 86400000);
      dl = `<span class="badge ${j < 0 ? 'badge-critical' : j <= 2 ? 'badge-warning' : 'badge-info'}">${j < 0 ? 'retard ' + Math.abs(j) + 'j' : j === 0 ? "aujourd'hui" : 'J-' + j}</span>`;
    }
    const who = o.customer ? `${o.customer.firstName || ''} ${o.customer.lastName || ''}`.trim() : '';
    return `<button class="row ${i === state.currentIndex ? 'cur' : ''}" onclick="closeOrderSheet();jumpToOrder(${i})"><b>${escapeHtml(o.name)}</b><span class="who">${escapeHtml(who)}</span>${isUrgentOrder(o) ? '🚨' : ''}${note ? '📝' : ''}${dl}</button>`;
  }).join('');
  d.innerHTML = `<div class="sheet"><h3>${state.orders.length} ${state.filterUrgent ? 'commandes urgentes' : 'commandes'}<button onclick="closeOrderSheet()" aria-label="Fermer">✕</button></h3>${rows}</div>`;
  document.body.appendChild(d);
  d.querySelector('.row.cur')?.scrollIntoView({ block: 'center' });
}
// ── Sendcloud : ouvre la commande en cours dans l'onglet Sendcloud du 2e écran ──
// Avec l'extension « RXWEAR → Sendcloud » : elle retrouve l'onglet Sendcloud déjà ouvert et le recharge sur place.
// Sans extension : repli sur une fenêtre nommée ouverte par le back-office.
function openInSendcloud() {
  const order = state.orders[state.currentIndex];
  if (!order) return;
  const num = String(order.name).replace(/\D/g, '');
  if (document.documentElement.dataset.rxSendcloudExt === '1') {
    window.postMessage({ type: 'RXWEAR_SENDCLOUD', order: num }, '*');
  } else {
    window.open('https://app.sendcloud.com/v2/shipping/list/orders?search=' + encodeURIComponent(num), 'sendcloud');
    showToast('📦 Sendcloud : ' + order.name + ' (extension non détectée)', 'warning');
  }
}
window.addEventListener('message', e => {
  if (e.source !== window || !e.data || e.data.type !== 'RXWEAR_SENDCLOUD_RESULT') return;
  if (e.data.ok) showToast('📦 Sendcloud : #' + e.data.order + (e.data.action === 'created' ? ' (nouvelle fenêtre)' : ' ouverte sur l\u2019autre écran'));
  else showToast('Sendcloud : ' + (e.data.error || 'erreur'), 'error');
});

function closeOrderSheet() { document.getElementById('co-sheet')?.remove(); }

async function prevOrder() {
  if (state.currentIndex > 0) { state.currentIndex--; renderOrderView(); window.scrollTo({top:0,behavior:'smooth'}); }
}
async function nextOrder() {
  if (state.currentIndex < state.orders.length-1) { state.currentIndex++; renderOrderView(); }
}
async function nextOrderAndScroll() { await nextOrder(); window.scrollTo({top:0,behavior:'smooth'}); }
function jumpToOrder(idx) { state.currentIndex = parseInt(idx); renderOrderView(); window.scrollTo({top:0,behavior:'smooth'}); }
async function toggleUrgentFilter() { return setCustomFilter(!state.filterUrgent); }
async function setCustomFilter(urgent) {
  if (state.filterUrgent === urgent && !state.orderSearchActive) return;
  state.filterUrgent = urgent; state.typedOrderNum = '';
  document.getElementById('content').innerHTML = `<div class="spinner"><div class="spinner-ring"></div>Chargement...</div>`;
  try { await fetchCustomOrders(state.filterUrgent); renderOrderView(); }
  catch(e) { document.getElementById('content').innerHTML = `<div class="alert alert-critical"><strong>Erreur :</strong> ${e.message}</div>`; }
}

async function searchOrderByNumber() {
  const raw = (state.typedOrderNum || '').trim();
  state.typedOrderNum = '';
  if (!raw) { showToast('Saisis un numéro de commande', 'warning'); return; }
  const num = raw.replace(/^#/, '');
  document.getElementById('content').innerHTML = `<div class="spinner"><div class="spinner-ring"></div>Recherche de la commande ${raw}...</div>`;
  try {
    const data = await gql(`query($q: String!) {
      orders(first: 5, query: $q) { edges { node { ${ORDER_FIELDS} } } }
    }`, { q: `name:*${num}*` });
    const found = data.orders.edges.map(e => e.node);
    if (!found.length) {
      showToast(`Aucune commande trouvée pour "${raw}"`, 'error');
      // On reste sur la liste courante (on ne la remplace que si la recherche trouve quelque chose)
      renderOrderView();
      return;
    }
    state.orders = found;
    state.currentIndex = 0;
    state.orderSearchActive = true;
    state.orderSearchQuery = raw;
    renderOrderView();
    window.scrollTo({top:0,behavior:'smooth'});
  } catch(e) {
    showToast('Erreur: '+e.message, 'error');
    document.getElementById('content').innerHTML = `<div class="alert alert-critical"><strong>Erreur :</strong> ${e.message}</div>`;
  }
}

async function clearOrderSearch() {
  state.orderSearchActive = false;
  state.orderSearchQuery = '';
  document.getElementById('content').innerHTML = `<div class="spinner"><div class="spinner-ring"></div>Chargement...</div>`;
  try { await fetchCustomOrders(state.filterUrgent); renderOrderView(); }
  catch(e) { document.getElementById('content').innerHTML = `<div class="alert alert-critical"><strong>Erreur :</strong> ${e.message}</div>`; }
}

async function fetchToOrderOrders() {
  let orders=[], hasNext=true, cursor=null;
  while (hasNext) {
    const data = await gql(`query($first:Int!,$after:String,$q:String!){orders(first:$first,after:$after,query:$q){edges{node{id name createdAt note customer{firstName lastName}dateLimiteTraitement:metafield(namespace:"custom",key:"date_limite_traitement"){value}estRush:metafield(namespace:"custom",key:"est_rush"){value}lineItems(first:250){edges{node{id title quantity currentQuantity variant{title imbretexSku:metafield(namespace:"custom",key:"imbretex_sku"){value}}}}}tags}}pageInfo{hasNextPage endCursor}}}`, {first:250,after:cursor,q:'tag:TOORDER AND status:open'});
    orders.push(...data.orders.edges.map(e=>e.node)); hasNext=data.orders.pageInfo.hasNextPage; cursor=data.orders.pageInfo.endCursor;
  }
  return orders;
}

async function renderSupplierTab() {
  const c = document.getElementById('content');
  c.innerHTML = pageHead('Commande fournisseur', '') + loadingBlock();
  try { state.supplierOrders = await fetchToOrderOrders(); state.supplierSnapshot = []; renderSupplierView(); loadHistory(); }
  catch(e) { c.innerHTML = pageHead('Commande fournisseur', '') + errorBlock(e.message, 'renderSupplierTab()'); }
}

  const count = state.supplierOrders.length;

    : `<span class="num">${count}</span> commande${count>1?'s':''} avec la balise TOORDER · <span class="num">${units}</span> article${units>1?'s':''}`;

    ${pageHead('Commande fournisseur', sub, `<button class="btn" onclick="renderSupplierTab()">${icon('refresh')}Actualiser</button>`)}

      <div class="step">
        <div class="step-header">
          <div class="step-number ${step1Done ? 'done' : ''}">${step1Done ? icon('check') : '1'}</div>
          <div><div class="step-title">Télécharger les fichiers de commande</div><div class="step-desc">Génère les fichiers à intégrer dans le panier fournisseur</div></div>
        </div>
        <div class="step-body">
          ${count === 0 ? `<div class="empty-inline ok">${icon('checkCircle')}Aucune commande avec la balise TOORDER.</div>` : `
          <div class="btn-group">
            <button class="btn btn-primary" onclick="downloadAndSnapshot('imbretex')">${icon('download')}Export IMBRETEX</button>
            <button class="btn" onclick="downloadAndSnapshot('complete')">${icon('download')}Export complet</button>
          </div>
          ${step1Done ? `<div class="empty-inline ok step-status">${icon('checkCircle')}${state.supplierSnapshot.length} commande${state.supplierSnapshot.length>1?'s':''} exportée${state.supplierSnapshot.length>1?'s':''} — passe à l'étape 2 une fois la commande fournisseur passée.</div>` : ''}
          ${renderDelaiWarnings(state.supplierOrders)}
          ${renderSupplierNotes(state.supplierOrders)}`}
        </div>
      </div>
      <div class="step">
        <div class="step-header">
          <div class="step-number ${!step1Done ? 'locked' : ''}">2</div>
          <div><div class="step-title">Valider la commande fournisseur</div><div class="step-desc">Supprime TOORDER, archive uniquement les commandes exportées</div></div>
        </div>
        <div class="step-body">
          ${!step1Done ? `<div class="empty-inline">${icon('lock')}Télécharge d'abord les fichiers à l'étape 1.</div>`
          : `<div id="step2-preview"><button class="btn btn-primary" onclick="previewStep2()">${icon('search')}Vérifier avant de valider</button></div>`}
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">

}

function renderDelaiWarnings(orders) {
  const withDelai = orders
    .filter(o => o.dateLimiteTraitement?.value)
    .map(o => {
      const dateLimite = new Date(o.dateLimiteTraitement.value + 'T00:00:00');
      const joursRestants = Math.ceil((dateLimite.getTime() - Date.now()) / 86400000);
      return { o, dateLimite, joursRestants };
    })
    .filter(x => x.joursRestants <= 3) // en retard ou à echeance proche seulement
    .sort((a, b) => a.joursRestants - b.joursRestants);
  if (withDelai.length === 0) return '';
  const rows = withDelai.map(({ o, dateLimite, joursRestants }) => {
    const customer = `${o.customer?.firstName||''} ${o.customer?.lastName||''}`.trim() || '—';
    const dateLabel = dateLimite.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
    const joursLabel = joursRestants < 0 ? `en retard de ${Math.abs(joursRestants)}j` : joursRestants === 0 ? "aujourd'hui" : `dans ${joursRestants}j`;
    const tone = joursRestants < 0 ? 'critical' : 'warning';
    const rushBadge = o.estRush?.value === 'true' ? `<span class="badge badge-solid-critical">${icon('zap')}RUSH</span>` : '';
    return `<div class="supplier-note-row">
      <span class="supplier-note-order num">${escapeHtml(o.name)}${rushBadge}</span>
      <span class="supplier-note-client">${escapeHtml(customer)}</span>
      <span class="badge badge-${tone}">${icon('clock')}${dateLabel} (${joursLabel})</span>
    </div>`;
  }).join('');
  return `<div class="supplier-notes-block">

async function validateSupplierOrders(orderIds) {
  const btn = event.target.closest('button'); btn.disabled = true; btn.textContent = 'Validation\u2026';
  const today = new Date();
  const newTag = `order_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  const removeMut = `mutation($id:ID!,$tags:[String!]!){tagsRemove(id:$id,tags:$tags){node{id}userErrors{message}}}`;
  const addMut = `mutation($id:ID!,$tags:[String!]!){tagsAdd(id:$id,tags:$tags){node{id}userErrors{message}}}`;
  let ok=0, errors=[];
  for (const id of orderIds) {
    try { await gql(removeMut,{id,tags:['TOORDER']}); await gql(addMut,{id,tags:[newTag]}); ok++; }
    catch(e) { errors.push(id); }
  }
  if (errors.length) showToast(`⚠️ Erreurs sur ${errors.length} commande(s)`, 'warning');
  else showToast(`✅ ${ok} commande(s) validée(s) — tag ${newTag} ajouté`);
  state.supplierSnapshot = [];
  // Recharge complète du tab pour refléter le nouvel état
  document.getElementById('content').innerHTML = pageHead('Commande fournisseur', '') + loadingBlock('Mise \u00e0 jour\u2026');
  state.supplierOrders = await fetchToOrderOrders();
  // Mise à jour du badge
  const badgeSupplier = document.getElementById('tab-supplier-badge');
  if (badgeSupplier) {
    if (state.supplierOrders.length > 0) { badgeSupplier.textContent = state.supplierOrders.length; badgeSupplier.style.display = ''; }
    else { badgeSupplier.style.display = 'none'; }
  }
  renderSupplierView();
  loadHistory();
}

function generateImbretex(orders, dateOverride = null) {
  const skuMap = new Map();
  orders.forEach(o => activeLineItemEdges(o).forEach(({node:li}) => {
    const sku = li.variant?.imbretexSku?.value; if (sku) skuMap.set(sku, (skuMap.get(sku)||0) + li.currentQuantity);
  }));
  const today = dateOverride ? new Date(parseInt(dateOverride.substring(0,4)),parseInt(dateOverride.substring(4,6))-1,parseInt(dateOverride.substring(6,8))) : new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let csv = 'REFERENCE ARTICLE;QUANTITE;DOSSIER (FACULTATIF)\n';
  skuMap.forEach((qty,sku) => { csv += `${sku};${qty};custom_${dateStr.replace(/-/g,'')}\n`; });
  return { url: `data:text/csv;charset=utf-8,${encodeURIComponent(csv)}`, filename: `commande-imbretex-${dateStr}.csv` };
}

function generateComplete(orders, dateOverride = null) {
  let csv = 'Numéro commande;Date;Client;Produit;Variant;Quantité;imbretex_sku;Notes commande\n';
  orders.forEach(o => {
    const date = new Date(o.createdAt).toLocaleDateString('fr-FR');
    const customer = o.customer ? `${o.customer.firstName||''} ${o.customer.lastName||''}`.trim() : '';
    const notes = (o.note||'').replace(/;/g,',').replace(/\n/g,' ');
    activeLineItemEdges(o).forEach(({node:li}) => { csv += `${o.name};${date};${customer};${li.title};${li.variant?.title||''};${li.currentQuantity};${li.variant?.imbretexSku?.value||''};${notes}\n`; });
  });
  const today = dateOverride ? new Date(parseInt(dateOverride.substring(0,4)),parseInt(dateOverride.substring(4,6))-1,parseInt(dateOverride.substring(6,8))) : new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  return { url: `data:text/csv;charset=utf-8,${encodeURIComponent(csv)}`, filename: `resume-commandes-${dateStr}.csv` };
}

async function loadHistory() {
  const el = document.getElementById('history-content'); if (!el) return;
  try {
    let orders=[], hasNext=true, cursor=null;
    while(hasNext){const data=await gql(`query($first:Int!,$after:String){orders(first:$first,after:$after){edges{node{id tags}}pageInfo{hasNextPage endCursor}}}`,{first:250,after:cursor});orders.push(...data.orders.edges.map(e=>e.node));hasNext=data.orders.pageInfo.hasNextPage;cursor=data.orders.pageInfo.endCursor;}
    const tagMap = new Map();
    orders.forEach(o => o.tags.forEach(t => { if(t.startsWith('order_')) tagMap.set(t,(tagMap.get(t)||0)+1); }));
    const tags = [...tagMap.entries()].map(([tag,count]) => { const d=tag.replace('order_',''); return d.length===8?{tag,count,date:`${d.slice(6,8)}/${d.slice(4,6)}/${d.slice(0,4)}`}:null; }).filter(Boolean).sort((a,b)=>b.tag.localeCompare(a.tag));
    if (!tags.length) { el.innerHTML = `<div class="empty-inline">Aucune commande fournisseur validée pour l'instant.</div>`; return; }
    el.innerHTML = `<table class="history-table"><thead><tr><th>Date</th><th>Commandes</th><th>Retélécharger</th></tr></thead><tbody>${tags.map(h=>`<tr><td><strong class="num">${h.date}</strong></td><td class="num">${h.count}</td><td><div class="btn-group"><button class="btn btn-sm" onclick="regenAndDownload('${h.tag}','imbretex')">${icon('download')}IMBRETEX</button><button class="btn btn-sm" onclick="regenAndDownload('${h.tag}','complete')">${icon('download')}Complet</button></div></td></tr>`).join('')}</tbody></table>`;
  } catch(e) { if(el) el.innerHTML = `<div class="empty-inline text-critical">${icon('xCircle')}Impossible de charger l'historique : ${escapeHtml(e.message)}</div>`; }
}

async function regenAndDownload(tag, type) {
  try {
    let orders=[], hasNext=true, cursor=null;
    while(hasNext){const data=await gql(`query($first:Int!,$after:String,$q:String!){orders(first:$first,after:$after,query:$q){edges{node{id name createdAt note customer{firstName lastName}lineItems(first:250){edges{node{id title quantity currentQuantity variant{title imbretexSku:metafield(namespace:"custom",key:"imbretex_sku"){value}}}}}tags}}pageInfo{hasNextPage endCursor}}}`,{first:250,after:cursor,q:`tag:${tag}`});orders.push(...data.orders.edges.map(e=>e.node));hasNext=data.orders.pageInfo.hasNextPage;cursor=data.orders.pageInfo.endCursor;}
    const dateStr = tag.replace('order_','');
    const {url,filename} = type==='imbretex'?generateImbretex(orders,dateStr):generateComplete(orders,dateStr);
    const a=document.createElement('a');a.href=url;a.download=filename;a.click();
    showToast(`✅ Téléchargé`);
  } catch(e) { showToast('Erreur: '+e.message,'error'); }
}

const PRINT_LOTS_NAMESPACE = 'rxwear_print';
const PRINT_LOTS_KEY = 'lots';

async function fetchPrintLots() {
  const data = await gql(`query{ shop{ id printLots: metafield(namespace:"${PRINT_LOTS_NAMESPACE}", key:"${PRINT_LOTS_KEY}"){ value } } }`);
  state.shopGid = data.shop.id;
  let lots = [];
  const raw = data.shop && data.shop.printLots ? data.shop.printLots.value : null;
  if (raw) { try { lots = JSON.parse(raw); } catch (e) { lots = []; } }
  if (!Array.isArray(lots)) lots = [];
  lots.sort(function (a, b) { return (b.dateGeneration || '').localeCompare(a.dateGeneration || ''); });
  return lots;
}

async function savePrintLotsData(lots) {
  await ensureShopGid();
  await metafieldsSetOne(PRINT_LOTS_KEY, JSON.stringify(lots), 'json', PRINT_LOTS_NAMESPACE);
}

async function addPrintLot(lot) {
  let lots = [];
  try { lots = await fetchPrintLots(); } catch (e) { lots = state.printLots || []; }
  lots.unshift(lot);
  await savePrintLotsData(lots);
  state.printLots = lots;
}

async function savePrintLotComment(lotId) {
  const ta = document.getElementById(`lot-comment-${lotId}`);
  if (!ta) return;
  const comment = ta.value;
  const btn = event.target.closest('button'); btn.disabled = true; btn.textContent = 'Enregistrement\u2026';
  try {
    let lots = state.printLots.slice();
    const idx = lots.findIndex(function (l) { return l.lotId === lotId; });
    if (idx === -1) throw new Error('Lot introuvable');
    lots[idx] = Object.assign({}, lots[idx], { comment: comment });
    await savePrintLotsData(lots);
    state.printLots = lots;
    showToast('💾 Commentaire enregistré');
  } catch (e) {
    showToast('Erreur: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = icon('save') + 'Enregistrer';
  }
}

async function regenPrintLotZip(lotId) {
  const lot = state.printLots.find(function (l) { return l.lotId === lotId; });
  if (!lot) return;
  const zone = document.getElementById(`lot-zip-result-${lotId}`);
  const btn = event.target.closest('button'); btn.disabled = true; btn.textContent = 'R\u00e9g\u00e9n\u00e9ration\u2026';
  try {
    const data = await gql(`query($ids:[ID!]!){ nodes(ids:$ids){ ... on Order {
      id name note
      lineItems(first:250){edges{node{
        id title quantity currentQuantity
        customAttributes{key value}
      }}}
    } } }`, { ids: lot.orderIds });
    const orders = (data.nodes || []).filter(Boolean);
    const gasOrders = [];
    for (const order of orders) {
      for (const { node: li } of activeLineItemEdges(order)) {
        const liAttrs = Object.fromEntries((li.customAttributes || []).map(a => [a.key, a.value]));
        const designUrls = Object.entries(liAttrs)
          .filter(([k]) => k.startsWith('_tib_design_link_'))
          .map(([, v]) => v)
          .filter(u => u && u.startsWith('http'));
        const annexeJson = JSON.stringify(
          Object.entries(liAttrs)
            .filter(([k, v]) => !k.startsWith('_') && v && /^https?:\/\//i.test(v))
            .reduce((obj, [k, v]) => { obj[k] = v; return obj; }, {})
        );
        gasOrders.push({ orderName: order.name, quantity: li.currentQuantity, note: order.note || '', productTitle: li.title || '', designUrls, customizationJson: annexeJson });
      }
    }
    const result = await callGas(gasOrders);
    const zipLinks = result.zips.map(z => `<a href="${z.url}" target="_blank" rel="noopener">${icon('archive')}${escapeHtml(z.name)}${icon('external')}</a>`).join('');
    if (zone) zone.innerHTML = `<div class="zip-result" style="margin-top:8px;">${zipLinks}</div>`;
    showToast('✅ ZIP régénéré');
  } catch (e) {
    if (zone) zone.innerHTML = `<div style="margin-top:8px;">${errorBlock(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.innerHTML = icon('refresh') + 'R\u00e9g\u00e9n\u00e9rer le ZIP';
  }
}

          <div class="lot-names num">${escapeHtml(namesPreview)}</div>
        </div>

  return `<div class="card" style="margin-top:16px;">

}

async function fetchTodoPrintOrders() {
  // Récupère les commandes TODOPRINT avec métafields teeinblue
  let orders=[], hasNext=true, cursor=null;
  while(hasNext) {
    const data = await gql(`query($first:Int!,$after:String,$q:String!){
      orders(first:$first,after:$after,query:$q){
        edges{node{
          id name createdAt note tags
          customer{firstName lastName}
          lineItems(first:250){edges{node{
            id title quantity currentQuantity
            variant{title}
            customAttributes{key value}
          }}}
        }}
        pageInfo{hasNextPage endCursor}
      }
    }`, {first:50,after:cursor,q:'tag:TODOPRINT AND status:open'});
    orders.push(...data.orders.edges.map(e=>e.node));
    hasNext=data.orders.pageInfo.hasNextPage; cursor=data.orders.pageInfo.endCursor;
  }
  return orders;
}

async function renderPrintTab() {
  const c = document.getElementById('content');
  c.innerHTML = pageHead('Impression', '') + loadingBlock('Chargement des commandes TODOPRINT…');
  try {
    const orders = await fetchTodoPrintOrders();
    state.printOrders = orders;
    state.printSelected = new Set(orders.map(o => o.id));
    state.printZipDone = false;
    state.printZipOrderIds = [];
    state.printZipZips = [];
    state.printWizardStep = 1;
    try { state.printLots = await fetchPrintLots(); state.printLotsLoaded = true; }
    catch (e) { state.printLots = []; state.printLotsLoaded = false; console.log('Erreur chargement lots impression:', e.message); }
    renderPrintView();
  } catch(e) {
    c.innerHTML = pageHead('Impression', '') + errorBlock(e.message, 'renderPrintTab()');
  }
}

function goToPrintStep(n) {
  state.printWizardStep = n;
  renderPrintView();
}

function renderPrintView() {
  const c = document.getElementById('content');
  const orders = state.printOrders;
  const refreshBtn = `<button class="btn" onclick="renderPrintTab()">${icon('refresh')}Actualiser</button>`;
  if (!orders.length) {
    c.innerHTML = pageHead('Impression', 'Aucune commande à imprimer', refreshBtn) +
      `<div class="card"><div class="empty-inline ok">${icon('checkCircle')}Aucune commande avec la balise TODOPRINT.</div></div>${renderPrintLotsSection()}`;
    return;
  }

  // Même schéma que l'assistant export fournisseur : les 3 étapes empilées,
  // toujours visibles ; une étape se déverrouille quand la précédente est faite.
  const selectedCount = state.printSelected.size;
  const zipDone = state.printZipDone;
  const zipCount = state.printZipOrderIds.length;
  const ordersWithNotes = orders.filter(o => o.note?.trim() && state.printSelected.has(o.id));
  const step1Done = selectedCount > 0;
  const plural = (n, w) => `${n} ${w}${n > 1 ? 's' : ''}`;

  // ── Étape 1 : sélection ──
  const orderRows = orders.map(o => {
    const isSelected = state.printSelected.has(o.id);
    const customer = o.customer ? `${o.customer.firstName||''} ${o.customer.lastName||''}`.trim() : '';
    const ageInDays = Math.floor((Date.now() - new Date(o.createdAt).getTime()) / 86400000);
    const activeItems = activeLineItemEdges(o);
    const totalQty = activeItems.reduce((s,{node:li})=>s+li.currentQuantity,0);
    const fileCount = activeItems.reduce((s,{node:li}) => {
      const attrs = Object.fromEntries((li.customAttributes||[]).map(a=>[a.key,a.value])); const designs = (attrs['All designs']||'').split(/[\s,]+/).filter(u=>u.startsWith('http'));
      const jsonUrls = extractPngSvgFromJson(attrs['Customization JSON']||'');
      return s + designs.length + jsonUrls.length;
    }, 0);
    return `<label class="print-order-item ${!isSelected?'deselected':''}" id="print-item-${o.id}">
      <input type="checkbox" ${isSelected?'checked':''} ${zipDone ? 'disabled' : ''} onchange="togglePrintOrder(this.dataset.id, this.checked)" data-id="${o.id}" />
      <div class="print-order-info">
        <div class="print-order-name"><span class="num">${escapeHtml(o.name)}</span> <span class="badge badge-info num">${totalQty} art.</span> <span class="badge badge-info num" title="Commande passée il y a ${ageInDays} jour${ageInDays>1?'s':''}">${ageInDays}j</span></div>
        <div class="print-order-detail">${escapeHtml(customer||'—')} · ${plural(activeItems.length, 'ligne')} · ${plural(fileCount, 'fichier')}</div>
        ${o.note?.trim() ? `<div class="print-order-note">${icon('note')}<span>${escapeHtml(o.note)}</span></div>` : ''}
      </div>
    </label>`;
  }).join('');

  const step1 = `
    <div class="step">
      <div class="step-header">
        <div class="step-number ${step1Done ? 'done' : ''}">${step1Done ? icon('check') : '1'}</div>
        <div><div class="step-title">Sélectionner les commandes à préparer</div><div class="step-desc" id="print-step1-desc">${plural(orders.length, 'commande')} avec balise TODOPRINT — ${selectedCount} sélectionnée${selectedCount>1?'s':''}</div></div>
        ${zipDone ? '' : `<div class="btn-group" style="margin-left:auto;">
          <button class="btn btn-sm" onclick="printSelectAll()">${icon('squareCheck')}Tout sélectionner</button>
          <button class="btn btn-sm" onclick="printDeselectAll()">${icon('square')}Tout désélectionner</button>
        </div>`}
      </div>
      <div class="step-body">
        ${zipDone ? `<div class="empty-inline" style="margin-bottom:10px;">${icon('lock')}ZIP généré : la sélection est figée. Actualise l'onglet pour repartir de zéro.</div>` : ''}
        <div class="print-order-list" style="margin-bottom:0;">${orderRows}</div>
        ${ordersWithNotes.length > 0 ? `
        <div class="alert alert-warning" style="margin-top:12px;margin-bottom:0;">
          ${icon('note')}<div><strong>${plural(ordersWithNotes.length, 'commande')} avec note</strong><span class="alert-text"> — incluses dans le notes.txt du ZIP</span></div>
        </div>` : ''}
      </div>
    </div>`;

  // ── Étape 2 : génération du ZIP ──
  let step2Body;
  if (zipDone) {
    const links = (state.printZipZips || []).map(z =>
      `<a href="${z.url}" target="_blank" rel="noopener">${icon('archive')}${escapeHtml(z.name)}${icon('external')}</a>`).join('');
    step2Body = `<div class="zip-result"><div class="zip-title">${icon('checkCircle')}ZIP généré dans ton Drive — ${plural(zipCount, 'commande')}</div>${links}</div>`;
  } else if (!step1Done) {
    step2Body = `<div class="empty-inline">${icon('lock')}Sélectionne au moins une commande à l'étape 1.</div>`;
  } else {
    step2Body = `<div id="zip-generate-zone">
        <button id="generate-zip-btn" class="btn btn-primary" onclick="generatePrintZip()">
          ${icon('archive')}<span>Générer le ZIP (<span id="zip-count">${selectedCount}</span> commande${selectedCount>1?'s':''})</span>
        </button>
      </div>
      <div id="zip-result-zone"></div>`;
  }
  const step2 = `

function extractPngSvgFromJson(jsonText) {
  if (!jsonText) return [];
  try {
    const obj = JSON.parse(jsonText);
    const found = [];
    (function walk(v) {
      if (!v) return;
      if (typeof v === 'string' && /^https?:\/\//i.test(v) && /\.(png|svg)(\?.*)?$/i.test(v)) found.push(v);
      else if (Array.isArray(v)) v.forEach(walk);
      else if (typeof v === 'object') Object.values(v).forEach(walk);
    })(obj);
    return [...new Set(found)];
  } catch {
    const re = /(https?:\/\/[^\s"'<>]+?\.(?:png|svg))(?:\?[^\s"'<>]*)?/ig;
    const out=[]; let m;
    while((m=re.exec(jsonText))!==null) out.push(m[0]);
    return [...new Set(out)];
  }
}

async function generatePrintZip() {
  const btn = event.target.closest('button');
  btn.disabled = true; btn.textContent = 'G\u00e9n\u00e9ration en cours\u2026 (1 \u00e0 2 min)';

  const selectedOrders = state.printOrders.filter(o => state.printSelected.has(o.id));

  // Prépare les données pour le GAS
  const gasOrders = [];
  for (const order of selectedOrders) {
    for (const {node:li} of activeLineItemEdges(order)) {
      const liAttrs = Object.fromEntries((li.customAttributes||[]).map(a=>[a.key,a.value]));
      // Les URLs de design sont dans _tib_design_link_1, _tib_design_link_2, etc.
      const designUrls = Object.entries(liAttrs)
        .filter(([k]) => k.startsWith('_tib_design_link_'))
        .map(([,v]) => v)
        .filter(u => u && u.startsWith('http'));
      // Les annexes PNG/SVG sont dans les valeurs qui sont des URLs (logos uploadés, etc.)
      const annexeJson = JSON.stringify(
        Object.entries(liAttrs)
          .filter(([k,v]) => !k.startsWith('_') && v && /^https?:\/\//i.test(v))
          .reduce((obj,[k,v]) => { obj[k]=v; return obj; }, {})
      );
      gasOrders.push({
        orderName: order.name,
        quantity: li.currentQuantity,
        note: order.note || '',
        productTitle: li.title || '',
        designUrls,
        customizationJson: annexeJson,
      });
    }
  }
  console.log('gasOrders count:', gasOrders.length, 'total designUrls:', gasOrders.reduce((s,o)=>s+o.designUrls.length,0));
  // Debug first order
  if (gasOrders[0]) console.log('First order designUrls:', gasOrders[0].designUrls);

  try {
    const result = await callGas(gasOrders);
    state.printZipDone = true;
    state.printZipOrderIds = selectedOrders.map(o => o.id);
    state.printZipZips = result.zips || [];
    // Les liens restent affichés dans l'étape 2, l'étape 3 se déverrouille
    renderPrintView();
    showToast('✅ ZIP généré avec succès !');
  } catch(e) {
    btn.disabled = false; btn.innerHTML = `${icon('archive')}<span>Générer le ZIP (<span id="zip-count">${state.printSelected.size}</span> commande${state.printSelected.size>1?'s':''})</span>`;
    document.getElementById('zip-result-zone').innerHTML = `<div style="margin-top:12px;">${errorBlock(e.message)}</div>`;
  }
}

async function validatePrintOrders() {
  const btn = event.target.closest('button'); btn.disabled = true; btn.textContent = 'Suppression en cours\u2026';
  const today = new Date();
  const printTag = `print_${today.getFullYear()}${String(today.getMonth()+1).padStart(2,'0')}${String(today.getDate()).padStart(2,'0')}`;
  const removeMut = `mutation($id:ID!,$tags:[String!]!){tagsRemove(id:$id,tags:$tags){node{id}userErrors{message}}}`;
  const addMut = `mutation($id:ID!,$tags:[String!]!){tagsAdd(id:$id,tags:$tags){node{id}userErrors{message}}}`;
  let ok=0, errors=[];
  for (const id of state.printZipOrderIds) {
    try {
      await gql(removeMut, {id, tags:['TODOPRINT']});
      await gql(addMut, {id, tags:[printTag]});
      ok++;
    }
    catch(e) { errors.push(id); }
  }
  if (errors.length) showToast(`⚠️ Erreurs sur ${errors.length} commande(s)`, 'warning');
  else showToast(`✅ ${ok} commande(s) archivées — tag ${printTag} ajouté`);

  // Enregistre le lot d'impression (historique + commentaire éventuel)
  try {
    const zippedOrders = state.printOrders.filter(o => state.printZipOrderIds.includes(o.id));
    const newLot = {
      lotId: 'lot_' + Date.now(),
      dateGeneration: new Date().toISOString(),
      tag: printTag,
      orderIds: state.printZipOrderIds.slice(),
      orderNames: zippedOrders.map(o => o.name),
      comment: ''
    };
    await addPrintLot(newLot);
  } catch (e) {
    showToast('⚠️ Tag posé mais erreur sauvegarde historique lot: ' + e.message, 'warning');
  }

  // Spinner pendant le rechargement
  document.getElementById('content').innerHTML = pageHead('Impression', '') + loadingBlock('Mise \u00e0 jour\u2026');
  // Petit délai pour laisser Shopify indexer les tags
  await new Promise(r => setTimeout(r, 2000));
  state.printZipOrderIds = [];
  try {
    state.printOrders = await fetchTodoPrintOrders();
    // Mise à jour badge
    const badgePrint = document.getElementById('tab-print-badge');
    if (badgePrint) {
      if (state.printOrders.length > 0) { badgePrint.textContent = state.printOrders.length; badgePrint.style.display = ''; }
      else { badgePrint.style.display = 'none'; }
    }
    await renderPrintTab();
  } catch (e) {
    document.getElementById('content').innerHTML = pageHead('Impression', '') + errorBlock('Balises mises \u00e0 jour, mais le rafra\u00eechissement a \u00e9chou\u00e9 : ' + e.message, 'renderPrintTab()');
  }
}

// Vérifie si la commande courante est traitée — confettis si oui
async function checkCurrentOrderDone() {
  if (state.activeTab !== 'custom') return;
  if (!state.isLoggedIn || !state.proxyUrl) return;
  if (!state.orders.length) return;

  const order = state.orders[state.currentIndex];
  if (!order) return;
  // Commande déjà expédiée/annulée à l'ouverture (ex. via la recherche) : rien à fêter ni à retirer
  if (orderShipState(order)) return;

  try {
    const data = await gql(`query($id:ID!){ order(id:$id){ id displayFulfillmentStatus tags } }`, { id: order.id });
    const current = data?.order;
    if (!current) return;

    const stillCustom = current.tags.includes('custom');
    const fulfilled = ['FULFILLED','PARTIALLY_FULFILLED'].includes(current.displayFulfillmentStatus);

    if (!stillCustom || fulfilled) {
      launchConfetti();
      playDoneSound();
      showToast('🎉 Commande traitée — suivante !');
      state.orders = state.orders.filter(o => o.id !== order.id);
      refreshCustomCounts();
      setTimeout(() => {
        if (!state.orders.length) { renderCustomTab(); return; }
        if (state.currentIndex >= state.orders.length) state.currentIndex = state.orders.length - 1;
        renderOrderView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, 400);
    }
  } catch(e) {
    // Silencieux
  }
}

async function galleryApi(action, extra) {
  extra = extra || {};
  const res = await fetch(state.proxyUrl.replace('/api/shopify', '/api/gallery'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-App-Password': state.appPassword },
    body: JSON.stringify(Object.assign({ action: action }, extra)),
  });
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    if (res.status === 413 || /request entity too large/i.test(text)) {
      throw new Error('Fichier trop volumineux pour l\'upload (limite ~4 Mo c\u00f4t\u00e9 serveur). R\u00e9essaie, l\'image sera compress\u00e9e automatiquement.');
    }
    throw new Error('R\u00e9ponse serveur invalide (HTTP ' + res.status + ')');
  }
  if (!res.ok) throw new Error(json.error || 'HTTP ' + res.status);
  return json;
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function() {
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function resizeImageForUpload(file, maxDim, quality) {
  return new Promise(function(resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function() {
      URL.revokeObjectURL(url);
      var w = img.width, h = img.height;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(w * scale));
      canvas.height = Math.max(1, Math.round(h * scale));
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function(blob) {
        if (!blob) { reject(new Error('Redimensionnement impossible')); return; }
        resolve(blob);
      }, 'image/jpeg', quality);
    };
    img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}

function ensureNicheLists(niche) {
  if (!galleryState.nicheProducts) galleryState.nicheProducts = {};
  var entry = galleryState.nicheProducts[niche];
  if (!entry || Array.isArray(entry)) {
    // Migration depuis l'ancien format (tableau plat) ou 1ère utilisation.
    var products = Array.isArray(entry) ? entry : [];
    entry = { lists: [{ id: 'default', name: 'Tous / non classés', products: products }] };
    galleryState.nicheProducts[niche] = entry;
  }
  if (!entry.lists || !entry.lists.length) {
    entry.lists = [{ id: 'default', name: 'Tous / non classés', products: [] }];
  }
  return entry;
}
function allNicheProductHandles(niche) {

// ── Drag & drop entre listes ──
var _paramsDrag = null;
function onParamsDragStart(e, niche, listId, handle) {
  _paramsDrag = { niche: niche, listId: listId, handle: handle };
  e.dataTransfer.effectAllowed = 'move';
}
function onParamsDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; e.currentTarget.classList.add('drag-over'); }
async function onParamsDrop(e, niche, targetListId) {
  e.preventDefault();
  if (!_paramsDrag || _paramsDrag.niche !== niche) { _paramsDrag = null; return; }
  if (_paramsDrag.listId === targetListId) { _paramsDrag = null; return; }
  var entry = ensureNicheLists(niche);
  var srcList = entry.lists.find(function (l) { return l.id === _paramsDrag.listId; });
  var dstList = entry.lists.find(function (l) { return l.id === targetListId; });
  var handle = _paramsDrag.handle;
  _paramsDrag = null;
  if (!srcList || !dstList) return;
  var idx = srcList.products.findIndex(function (p) { return p.productHandle === handle; });
  if (idx === -1) return;
  var moved = srcList.products.splice(idx, 1)[0];
  dstList.products.push(moved);
  try { await persistNicheProducts(); showToast('Produit déplacé vers "' + dstList.name + '"'); }
  catch (e2) { showToast('Erreur: ' + e2.message, 'error'); }
  renderGalleryUI();
}

async function createNicheList() {
  var name = prompt('Nom de la nouvelle liste (ex: Tank, Crop...)');
  if (!name || !name.trim()) return;
  var niche = galleryState.paramsNiche || 'cf';
  var entry = ensureNicheLists(niche);
  var id = 'list-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  entry.lists.push({ id: id, name: name.trim(), products: [] });
  try { await persistNicheProducts(); showToast('Liste créée'); } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
  renderGalleryUI();
}
async function renameNicheList(niche, listId, newName) {
  if (!newName || !newName.trim()) { renderGalleryUI(); return; }
  var entry = ensureNicheLists(niche);
  var list = entry.lists.find(function (l) { return l.id === listId; });
  if (!list) return;
  list.name = newName.trim();
  try { await persistNicheProducts(); showToast('Liste renommée'); } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
  renderGalleryUI();
}
async function deleteNicheList(niche, listId) {
  var entry = ensureNicheLists(niche);
  var list = entry.lists.find(function (l) { return l.id === listId; });
  if (!list) return;
  if (!confirm('Supprimer la liste "' + list.name + '" ? Ses produits (' + list.products.length + ') seront renvoyés dans "' + entry.lists[0].name + '".')) return;
  entry.lists = entry.lists.filter(function (l) { return l.id !== listId; });
  entry.lists[0].products = entry.lists[0].products.concat(list.products);
  try { await persistNicheProducts(); showToast('Liste supprimée'); } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
  renderGalleryUI();
}

async function syncNicheFromShopify(niche) {
  galleryState.paramsSyncing = true;
  renderGalleryUI();
  try {
    var r = await galleryApi('getNicheTaggedProducts', { niche: niche });
    var found = r.products || [];
    var entry = ensureNicheLists(niche);
    var already = allNicheProductHandles(niche);
    var added = 0;
    found.forEach(function (p) {
      if (already[p.handle]) return;
      entry.lists[0].products.push({ productHandle: p.handle, title: p.title, imageUrl: (p.featuredImage && p.featuredImage.url) || null });
      already[p.handle] = true;
      added++;
    });
    if (added > 0) { await persistNicheProducts(); showToast(added + ' produit(s) ajouté(s) depuis Shopify'); }
    else showToast('Déjà à jour, aucun nouveau produit');
  } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
  galleryState.paramsSyncing = false;
  renderGalleryUI();
}

let _paramsSearchTimer = null;
function searchParamProductDebounced(term) {
  clearTimeout(_paramsSearchTimer);
  _paramsSearchTimer = setTimeout(function () { searchParamProduct(term); }, 350);
}
async function searchParamProduct(term) {
  var box = document.getElementById('params-search-results');

async function addNicheProduct(resultIdx) {

async function removeNicheProduct(niche, listId, handle) {
  var entry = ensureNicheLists(niche);

  if (!list) return;
