// ── Sélection des produits compatibles pour UN design (dans le formulaire manuel) ──
function buildCampaignProductsHtml(niche, existingList) {
  existingList = existingList || [];
  if (!niche) return '<div class="field-hint" style="margin:0;">Choisis d\'abord une niche ci-dessus.</div>';
  var entry = ensureNicheLists(niche);
  var hasAny = entry.lists.some(function (l) { return l.products.length > 0; });
  if (!hasAny) return '<div class="field-hint" style="margin:0;">Aucun produit configuré pour cette niche. Va dans l\'onglet Paramètres pour en ajouter.</div>';
  var h = '';
  var i = 0;
  entry.lists.forEach(function (list) {
    if (!list.products.length) return;
    h += '<div class="campaign-group">' + escapeHtml(list.name) + '</div>';
    list.products.forEach(function (p) {
      var thisIdx = i++;
      var existing = existingList.find(function (cp) { return cp.productHandle === p.productHandle; });
      var checked = !!existing;
      h += '<div class="campaign-row">';
      h += '<input type="checkbox" id="mf-cp-check-' + thisIdx + '" data-handle="' + escapeHtml(p.productHandle) + '" ' + (checked ? 'checked' : '') + ' onchange="toggleCampaignProductRow(' + thisIdx + ')" />';
      h += '<label class="pname" for="mf-cp-check-' + thisIdx + '" title="' + escapeHtml(p.productHandle) + '">' + escapeHtml(p.title || p.productHandle) + '</label>';
      h += '<input class="input input-sm" type="text" id="mf-cp-cid-' + thisIdx + '" placeholder="Customization ID *" value="' + escapeHtml(existing && existing.customizationId || '') + '" style="flex:1;min-width:0;" ' + (checked ? '' : 'disabled') + ' />';
      h += '<input class="input input-sm" type="text" id="mf-cp-vid-' + thisIdx + '" placeholder="Variant ID" value="' + escapeHtml(existing && existing.variantId || '') + '" style="flex:0 0 130px;" ' + (checked ? '' : 'disabled') + ' />';
      h += '</div>';
    });
  });
  return h;
}
function toggleCampaignProductRow(i) {
  var chk = document.getElementById('mf-cp-check-' + i);
  var cid = document.getElementById('mf-cp-cid-' + i);
  var vid = document.getElementById('mf-cp-vid-' + i);
  if (cid) cid.disabled = !chk.checked;
  if (vid) vid.disabled = !chk.checked;
}
function onManualNicheChange() {
  var niche = document.getElementById('mf-niche').value;
  var container = document.getElementById('mf-campaign-products');
  if (container) container.innerHTML = buildCampaignProductsHtml(niche, []);
}
function collectCampaignProducts(niche) {
  var container = document.getElementById('mf-campaign-products');
  if (!container) return [];
  var out = [];
  var checks = container.querySelectorAll('input[type="checkbox"][id^="mf-cp-check-"]');
  checks.forEach(function (chk) {
    if (!chk.checked) return;
    var handle = chk.getAttribute('data-handle');
    var idx = chk.id.replace('mf-cp-check-', '');
    var cidEl = document.getElementById('mf-cp-cid-' + idx);
    var vidEl = document.getElementById('mf-cp-vid-' + idx);
    var cid = (cidEl && cidEl.value || '').trim();
    var vid = (vidEl && vidEl.value || '').trim();
    if (!cid) return; // sans customization-id, l'entrée ne sert à rien côté front
    out.push({ productHandle: handle, customizationId: cid, variantId: vid || null });
  });
  return out;
}

async function renderGalleryTab() {
  const c = document.getElementById('content');
  c.innerHTML = pageHead('Galerie', '') + loadingBlock();
  if (!galleryState.savedLoaded) {
    try { const r = await galleryApi('get'); galleryState.savedItems = (r.items || []).filter(Boolean); }
    catch(e) { galleryState.savedItems = []; }
    galleryState.savedLoaded = true;
  }
  if (!galleryState.nicheProductsLoaded) {
    try { const r = await galleryApi('getNicheProducts'); galleryState.nicheProducts = r.nicheProducts || {}; }
    catch(e) { galleryState.nicheProducts = {}; }
    galleryState.nicheProductsLoaded = true;
  }
  // Reprendre la position sauvegardée si aucune commande chargée
  if (galleryState.browseOrders.length === 0 && !galleryState.browseLoading) {
    const savedCursor = loadSavedPosition();
    const savedCount = getSavedCount();
    if (savedCursor && savedCount > 0) {
      // Proposer de reprendre
      galleryState._resumeAvailable = { cursor: savedCursor, count: savedCount };
    }
    await loadMoreBrowseOrders();
  }
  renderGalleryUI();
}

async function loadMoreBrowseOrders() {
  if (galleryState.browseLoading) return;
  galleryState.browseLoading = true;
  try {
    var r = await galleryApi('fetchOrders', { cursor: galleryState.browseCursor });
    galleryState.browseOrders = galleryState.browseOrders.concat(r.orders || []);
    galleryState.browseCursor = (r.pageInfo && r.pageInfo.endCursor) || null;
    galleryState.browseHasNext = (r.pageInfo && r.pageInfo.hasNextPage) || false;
    galleryState.lastDebug = r.debug || null;
    savePosition();
    // Marquer les commandes chargées comme vues automatiquement
    (r.orders || []).forEach(function(o) { markOrderSeen(o.id); });
  } catch(e) { galleryState.lastDebug = { error: e.message }; }
  galleryState.browseLoading = false;
}

}
function getCustId(li) {

}

// ── Drag & drop ──
function onDragStart(e,idx,niche){galleryState.dragSrcIdx=idx;galleryState.dragNiche=niche;e.dataTransfer.effectAllowed='move';}
function onDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function onDragEnter(e){e.currentTarget.classList.add('drag-over');}
function onDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function onDrop(e,targetIdx,niche){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(niche==='all'||niche==='other')return;
  const src=galleryState.dragSrcIdx;
  if(src===null||src===targetIdx||galleryState.dragNiche!==niche)return;
  const matchNiche=function(i){return niche==='official'?i.source==='official':i.niche===niche;};
  const ni=galleryState.savedItems.filter(matchNiche);
  const ot=galleryState.savedItems.filter(function(i){return !matchNiche(i);});
  if(src<0||src>=ni.length||targetIdx<0||targetIdx>=ni.length){galleryState.dragSrcIdx=null;return;}
  const moved=ni.splice(src,1)[0];ni.splice(targetIdx,0,moved);
  galleryState.savedItems=ni.concat(ot);galleryState.dragSrcIdx=null;
  galleryApi('save',{items:galleryState.savedItems}).then(function(){showToast('Ordre sauvegard\u00e9');}).catch(function(e){showToast('Erreur: '+e.message,'error');});
  renderGalleryUI();
}
function onDragEnd(){galleryState.dragSrcIdx=null;galleryState.dragNiche=null;}

function startEditTags(ri){galleryState.editingTags=ri;galleryState.savedSelection=[];galleryState.showBulkTag=false;renderGalleryUI();setTimeout(function(){var i=document.getElementById('edit-tag-input-'+ri);if(i)i.focus();},50);}
function addEditTag(ri){var inp=document.getElementById('edit-tag-input-'+ri);if(!inp)return;var tag=inp.value.trim().toLowerCase().replace(/,/g,'');if(!tag)return;if(!galleryState.savedItems[ri].tags)galleryState.savedItems[ri].tags=[];if(galleryState.savedItems[ri].tags.indexOf(tag)===-1){galleryState.savedItems[ri].tags.push(tag);inp.value='';renderGalleryUI();setTimeout(function(){startEditTags(ri);},50);}else inp.value='';}

// ── Rendu onglet Parcourir ──
function renderBrowsePanel() {
  var el = document.getElementById('gallery-browse-panel');
  if (!el) return;
  var seen = getSeenOrders();
  var imgs = [];
  galleryState.browseOrders.forEach(function(order) {
    order.lineItems.edges.forEach(function(e) {
      var li = e.node; var url = getImageUrl(li); if (!url) return;
      imgs.push({ imageUrl:url, customizationId:getCustId(li),
        productHandle:li.variant&&li.variant.product?li.variant.product.handle:null,
        variantId:li._variantId||null, variantTitle:li._variantTitle||null,
        title:li.title, orderName:order.name, niche:li._niche||null,
        orderId: order.id });
    });
  });
  window._galleryImages = imgs;

  var newCount = imgs.filter(function(img){ return !isAlreadySaved(img.imageUrl); }).length;
  var publishedCount = imgs.filter(function(img){ return isAlreadySaved(img.imageUrl); }).length;

  var h = '';

  // Barre infos + actions
  h += '<div class="browse-bar">';
  h += '<span><strong class="num">'+imgs.length+'</strong> rendus chargés';
  if (publishedCount) h += ' <span class="muted">·</span> <span class="text-success">'+publishedCount+' déjà publiés</span>';
  if (newCount) h += ' <span class="muted">·</span> <strong>'+newCount+'</strong> à traiter';
  h += '</span>';
  h += '<div class="btn-group">';
  if (galleryState.browseHasNext) h += '<button class="btn btn-sm" onclick="loadMoreAndRefresh()">'+icon('plus')+'Charger plus (+250)</button>';
  h += '<button class="btn btn-sm" onclick="resetBrowse()">'+icon('refresh')+'Recommencer</button>';
  h += '</div></div>';

  // Grille
  if (!imgs.length) {
    h += '<div class="gallery-empty">Aucune image teeinblue trouvée';
    var d = galleryState.lastDebug;
    if (d) {
      h += '<div class="report-box" style="margin:12px auto 0;max-width:420px;text-align:left;font-size:12px;">';
      h += (d.totalOrders||0)+' commandes, '+(d.ordersWithImages||0)+' avec images<br>';
      if (d.sampleAttrs&&d.sampleAttrs.length) h += 'Clés : '+d.sampleAttrs.map(function(a){return escapeHtml(a.key);}).join(', ');
      if (d.error) h += '<br><span class="text-critical">'+escapeHtml(d.error)+'</span>';
      h += '<div style="margin-top:10px;"><button class="btn btn-sm" onclick="loadAllOrdersDebug()">'+icon('search')+'Scanner sans filtre</button></div></div>';
    }
    h += '</div>';
  } else {
    h += '<div class="order-browse-grid">';
    imgs.forEach(function(img, idx) {
      var sel = isInSelection(img.imageUrl);
      var sav = isAlreadySaved(img.imageUrl);
      h += '<div class="order-img-card'+(sel?' selected':'')+(sav?' is-saved':'')+'" role="button" tabindex="0" aria-pressed="'+sel+'" aria-label="Rendu '+escapeHtml(img.orderName)+(sav?' (déjà publié)':'')+'" onclick="toggleSelection('+idx+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleSelection('+idx+')}">';
      h += '<img src="'+img.imageUrl+'" alt="" loading="lazy" />';
      if (sav) h += '<div class="saved-flag"><span>'+icon('check')+'Publié</span></div>';
      h += mkBadge(img.niche);
      if (img.variantTitle&&img.variantTitle!=='Default Title') h += '<span class="variant-strip">'+escapeHtml(img.variantTitle)+'</span>';
      h += '<div class="img-meta">'+escapeHtml(img.orderName)+'</div>';
      h += '<div class="img-check">'+icon('check')+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }

  el.innerHTML = h;
}

// ── Badges discrets EN/ES : indiquent qu'un design a été explicitement
// adapté/traduit pour ce marché (case "Nécessite une adaptation du design
// pour ce marché" cochée dans le bloc Marchés du formulaire). Simplement
// cocher "Disponible sur ce marché" sans adaptation ne suffit pas : dans ce
// cas le design FR est réutilisé tel quel, donc pas de badge. Rien ne
// s'affiche non plus pour les designs legacy sans champ `markets`.
var MARKET_BADGE_DEFS=[{code:'en',label:'EN',bg:'#1a73e8'},{code:'es',label:'ES',bg:'#c9622a'}];
function renderMarketBadges(item){
  if(!item||!item.markets) return '';
  var active=MARKET_BADGE_DEFS.filter(function(d){var m=item.markets[d.code];return m&&m.needsAdaptation;});
  if(!active.length) return '';
  return '<div class="market-badges">'+active.map(function(d){return '<span class="market-badge" style="background:'+d.bg+';" title="Adapté / traduit pour le marché '+d.label+'">'+d.label+'</span>';}).join('')+'</div>';
}

function renderSavedNicheTab(niche) {
  var items; var allTags=getAllTags();
  if(niche==='all') items=galleryState.savedItems;
  else if(niche==='official') items=galleryState.savedItems.filter(function(i){return i.source==='official';});
  else if(niche==='other') items=galleryState.savedItems.filter(function(i){return !i.niche||(i.niche!=='cf'&&i.niche!=='running');});
  else items=galleryState.savedItems.filter(function(i){return i.niche===niche;});
  var nicheIndices=[];
  galleryState.savedItems.forEach(function(item,ri){
    var matches=(niche==='all')||(niche==='official'&&item.source==='official')||(niche==='other'&&(!item.niche||(item.niche!=='cf'&&item.niche!=='running')))||(item.niche===niche);
    if(matches) nicheIndices.push(ri);
  });
  var allSel=nicheIndices.length>0&&nicheIndices.every(function(ri){return galleryState.savedSelection.indexOf(ri)>-1;});

  var h='';
  h+='<div class="saved-toolbar">';

    h+='<span class="muted num">'+selCount+' sélectionné(s)</span>';
    h+='<button class="btn btn-sm btn-primary" onclick="galleryState.showBulkTag=!galleryState.showBulkTag;renderGalleryUI()">'+icon('tag')+'Tag en masse</button>';
    h+='<button class="btn btn-sm" onclick="galleryState.savedSelection=[];renderGalleryUI()">'+icon('x')+'Désélectionner</button>';
  }
  h+='<span class="hint">'+icon('move')+'Glisse pour réordonner · survole une vignette pour la modifier</span>';
  h+='</div>';
  if(galleryState.showBulkTag&&selCount>0){
    h+='<div class="bulk-box"><div class="section-label" style="font-size:13px;margin-bottom:8px;">Tag en masse sur '+selCount+' rendu(s)</div>';
    h+='<div class="btn-group"><input class="input input-sm" id="bulk-tag-input" type="text" placeholder="Nom du tag…" list="bulk-tag-dl" style="width:200px;" onkeydown="if(event.key===\'Enter\'){applyBulkTag();}" /><datalist id="bulk-tag-dl">'+allTags.map(function(t){return '<option value="'+escapeHtml(t)+'">';}).join('')+'</datalist>';
    h+='<button class="btn btn-sm btn-primary" onclick="applyBulkTag()">'+icon('plus')+'Ajouter</button><button class="btn btn-sm btn-danger" onclick="removeBulkTag()">'+icon('minus')+'Retirer</button><button class="btn btn-sm" onclick="galleryState.showBulkTag=false;renderGalleryUI()">Annuler</button></div>';
    if(allTags.length){h+='<div class="tag-suggestions" style="margin-top:8px;">'+allTags.map(function(t){return '<button class="tag-sug-btn" onclick="document.getElementById(\'bulk-tag-input\').value=\''+t+'\'">'+escapeHtml(t)+'</button>';}).join('')+'</div>';}
    h+='</div>';
  }
  if(!items.length)return h+'<div class="gallery-empty">Aucun rendu publié ici</div>';
  h+='<div class="saved-gallery-grid">';
  items.forEach(function(item,idx){
    var ri=galleryState.savedItems.indexOf(item);
    var isEditing=galleryState.editingTags===ri;
    var isSel=galleryState.savedSelection.indexOf(ri)>-1;
    h+='<div class="saved-img-card'+(isSel?' is-selected':'')+'" draggable="true" ondragstart="onDragStart(event,'+idx+',\''+niche+'\')" ondragover="onDragOver(event)" ondragenter="onDragEnter(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event,'+idx+',\''+niche+'\')" ondragend="onDragEnd()">';
    h+='<div class="sel-box"><input type="checkbox" '+(isSel?'checked':'')+' aria-label="Sélectionner" onclick="event.stopPropagation();toggleSavedSelection('+ri+')" /></div>';
    if(item.source==='official')h+='<div class="official-flag" title="Design officiel">'+icon('star')+'</div>';
    h+=renderMarketBadges(item);
    h+='<img src="'+item.imageUrl+'" alt="'+escapeHtml(item.title||'')+'" loading="lazy" onclick="toggleSavedSelection('+ri+')" />';
    if(isEditing){
      h+='<div class="tag-edit"><div style="display:flex;flex-wrap:wrap;gap:3px;">'+(item.tags||[]).map(function(t){return '<span class="g-tag">'+escapeHtml(t)+'<button onclick="removeEditTag('+ri+',\''+t+'\')" aria-label="Retirer le tag '+escapeHtml(t)+'">'+icon('x')+'</button></span>';}).join('')+'</div>';

      h+='<div style="display:flex;gap:4px;"><button class="btn btn-sm btn-primary" style="flex:1;" onclick="saveEditTags('+ri+')">Sauver</button><button class="btn btn-sm" onclick="cancelEditTags()">Annuler</button></div></div>';
    }
    else{h+='<div class="saved-tags">'+(item.tags||[]).map(function(t){return '<span class="saved-tag">'+escapeHtml(t)+'</span>';}).join('')+'</div>';if(item.variantId)h+='<div class="var-id">var. …'+String(item.variantId).slice(-6)+'</div>';}

// ── Bloc "Marchés" du formulaire d'ajout/édition d'un design ──
// FR est toujours disponible (pas de case, pas d'entrée dans item.markets — ce
// sont les champs racine customizationId/imageUrl qui font foi). EN et ES ont
// chacun une case "Disponible sur ce marché" ; si cochée, une sous-case
// "Nécessite une adaptation du design pour ce marché" fait apparaître un
// customizationId + une imageUrl spécifiques à ce marché (mêmes composants que
// les champs FR, dupliqués). Si la sous-case n'est pas cochée, le design FR
// est réutilisé tel quel pour ce marché (rien à saisir).
var MARKET_DEFS=[{code:'en',label:'Anglais (EN)'},{code:'es',label:'Espagnol (ES)'}];
function renderMarketFieldset(code,label){
  var h='<div class="market-block" id="mf-mkt-'+code+'-block">';
  h+='<label class="option-box"><input id="mf-mkt-'+code+'-avail" type="checkbox" onchange="onMarketAvailChange(\''+code+'\')" /> Disponible sur ce marché — '+label+'</label>';
  h+='<div id="mf-mkt-'+code+'-sub" class="option-sub" style="display:none;">';
  h+='<label class="check-row" style="font-size:13px;"><input id="mf-mkt-'+code+'-adapt" type="checkbox" onchange="onMarketAdaptChange(\''+code+'\')" /> Nécessite une adaptation du design pour ce marché</label>';
  h+='<div class="field-hint" style="margin-top:3px;">Décoché : le design FR (image + customization ID ci-dessus) est réutilisé tel quel sur ce marché.</div>';
  h+='<div id="mf-mkt-'+code+'-fields" class="form-grid cols-2" style="display:none;margin-top:10px;">';
  h+='<div class="form-group"><label for="mf-mkt-'+code+'-cid">Customization ID '+label+'</label><input id="mf-mkt-'+code+'-cid" type="text" placeholder="1a33ab74-…" /></div>';
  h+='<div class="form-group"><label for="mf-mkt-'+code+'-img">URL du mockup '+label+'</label><input id="mf-mkt-'+code+'-img" type="text" placeholder="https://cdn.teeinblue.com/…" />';
  h+='<div class="file-row"><input id="mf-mkt-'+code+'-img-file" type="file" accept="image/*" aria-label="Fichier mockup '+label+'" /><button class="btn btn-sm" type="button" onclick="uploadMarketImage(\''+code+'\')">'+icon('upload')+'Uploader</button></div>';
  h+='<div class="field-hint">Colle une URL, ou uploade ton propre mockup (PNG/JPG)</div><img id="mf-mkt-'+code+'-prev" class="mini-preview" src="" alt="" /></div>';
  h+='</div></div></div>';
  return h;
}
function onMarketAvailChange(code){
  var avail=document.getElementById('mf-mkt-'+code+'-avail').checked;
  var sub=document.getElementById('mf-mkt-'+code+'-sub');
  if(sub)sub.style.display=avail?'block':'none';
  if(!avail){
    var adapt=document.getElementById('mf-mkt-'+code+'-adapt');
    if(adapt)adapt.checked=false;
  }
  onMarketAdaptChange(code);
}
function onMarketAdaptChange(code){
  var adapt=document.getElementById('mf-mkt-'+code+'-adapt');
  var fields=document.getElementById('mf-mkt-'+code+'-fields');
  if(fields)fields.style.display=(adapt&&adapt.checked)?'grid':'none';
}
function collectMarketData(code){
  var availEl=document.getElementById('mf-mkt-'+code+'-avail');
  var adaptEl=document.getElementById('mf-mkt-'+code+'-adapt');
  var available=!!(availEl&&availEl.checked);
  var needsAdaptation=available&&!!(adaptEl&&adaptEl.checked);
  var cid=needsAdaptation?document.getElementById('mf-mkt-'+code+'-cid').value.trim():'';
  var img=needsAdaptation?document.getElementById('mf-mkt-'+code+'-img').value.trim():'';
  return{available:available,needsAdaptation:needsAdaptation,customizationId:cid||null,imageUrl:img||null};
}

  h+='</div><div class="manual-submit"><button class="btn btn-primary" onclick="submitManual()">'+icon(isEditing?'save':'plus')+(isEditing?'Enregistrer les modifications':'Ajouter à la galerie')+'</button><div class="mf-preview"><img id="mf-prev" src="" alt="Aperçu" /></div></div>';
  h+='<div id="mf-err" class="form-error"></div></div></div>';

}

function parseTeeinblueJson(){
  var raw=document.getElementById('mf-json').value.trim();
  var err=document.getElementById('mf-json-err');
  err.style.display='none';
  if(!raw){err.textContent='Colle d\'abord un JSON dans la zone ci-dessus';err.style.display='block';return;}
  var obj;
  try{obj=JSON.parse(raw);}catch(e){err.textContent='JSON invalide : '+e.message;err.style.display='block';return;}
  // Objet panier complet ({"items":[...]}) : on prend la 1re ligne (ou la 1re qui a une image de customisation)
  if(obj&&Array.isArray(obj.items)&&obj.items.length){
    var withImage=obj.items.find(function(it){
      var p=it.properties||it;
      return p['_customization_image']||p['customization_image']||p['customization-image']||p['Customization Image'];
    });
    obj=withImage||obj.items[0];
  }
  var props=obj.properties||obj;
  function pick(sources,keys){for(var s=0;s<sources.length;s++){var src=sources[s];if(!src)continue;for(var i=0;i<keys.length;i++){if(src[keys[i]])return src[keys[i]];}}return '';}
  var img=pick([props,obj],['_customization_image','customization-image','customization_image','Customization Image']);
  var cid=pick([props,obj],['_customization_id','customization-id','customization_id','_tib_customization_id','tib_customization_id']);
  var hdl=obj.handle||'';
  var vid=obj.variant_id||obj.id||'';
  var ttl=obj.product_title||obj.title||'';
  var filled=[];
  if(img){document.getElementById('mf-img').value=img;filled.push('image');}
  if(cid){document.getElementById('mf-cid').value=cid;filled.push('ID');}
  if(hdl){document.getElementById('mf-hdl').value=hdl;filled.push('handle');}
  if(vid){document.getElementById('mf-vid').value=vid;filled.push('variant');}
  if(ttl){document.getElementById('mf-ttl').value=ttl;filled.push('titre');}
  if(!img&&!cid&&!hdl&&!vid&&!ttl){err.textContent='Aucun champ reconnu dans ce JSON (verifie qu il contient _customization_id / _customization_image / handle...)';err.style.display='block';return;}
  if(!img){err.textContent='Attention : aucune image de customisation trouvee dans cette ligne (peut-etre un frais annexe plutot qu un vrai design) — verifie le champ Image URL avant d\'ajouter.';err.style.display='block';}
  var hay=((hdl||'')+' '+(ttl||'')).toLowerCase();
  var nicheSel=document.getElementById('mf-niche');
  if(hay.indexOf('running')>-1)nicheSel.value='running';
  else if(hay.indexOf('crossfit')>-1||hay.indexOf('hyrox')>-1||hay.indexOf('oversize')>-1||hay.indexOf('crop')>-1||hay.indexOf('tank')>-1||hay.indexOf('debardeur')>-1)nicheSel.value='cf';
  var prev=document.getElementById('mf-prev');if(img){prev.src=img;prev.style.display='block';}
  showToast('Champs remplis : '+filled.join(', '));
}

    h+='<div class="tag-input-row"><input class="input input-sm" type="text" id="ti-'+idx+'" placeholder="Tag…" aria-label="Nouveau tag" onkeydown="if(event.key===\'Enter\'||event.key===\',\'){event.preventDefault();addTagSel('+idx+')}" list="tdl-'+idx+'" /><button class="btn btn-sm btn-icon" onclick="addTagSel('+idx+')" aria-label="Ajouter le tag">'+icon('plus')+'</button></div>';
    h+='<datalist id="tdl-'+idx+'">'+suggs.map(function(t){return '<option value="'+escapeHtml(t)+'">';}).join('')+'</datalist>';
    if(suggs.length)h+='<div class="tag-suggestions" style="margin-top:6px;">'+suggs.map(function(t){return '<button class="tag-sug-btn" onclick="quickTagSel('+idx+',\''+t+'\')">'+escapeHtml(t)+'</button>';}).join('')+'</div>';

function renderGalleryUI() {
  var c = document.getElementById('content');
  var sel = galleryState.selection.length;
  var total = galleryState.savedItems.length;
  var tab = galleryState.galleryTab;

  // En-tête collant : titre + actions, puis les sous-onglets de la galerie
  var actions = '';
  if (tab === 'browse') {
    actions += '<button class="btn" onclick="galleryState.showManualForm=!galleryState.showManualForm;galleryState.editingItemIndex=null;renderGalleryUI()">' + (galleryState.showManualForm ? icon('x') + 'Fermer l’ajout manuel' : icon('plus') + 'Ajout manuel') + '</button>';
  }
  if (tab === 'browse' || tab === 'published') {
    actions += '<button class="btn btn-primary" onclick="saveGallery()" id="btn-sg"' + (!sel ? ' disabled' : '') + ' title="Publier les rendus sélectionnés dans la galerie">' + icon('save') + 'Sauvegarder (' + sel + ')</button>';
  }
  var tabs = [
    { id: 'browse', ic: 'image', label: 'Parcourir' },
    { id: 'published', ic: 'check', label: 'Publiés', count: total },
    { id: 'icons', ic: 'palette', label: 'Icônes' },
    { id: 'params', ic: 'sliders', label: 'Paramètres' },
  ];
  var h = '<div class="page-head sticky"><div><h1>Galerie</h1><div class="page-sub">Galerie d’inspiration du site · <span class="num">' + total + '</span> rendu' + (total > 1 ? 's' : '') + ' publié' + (total > 1 ? 's' : '') + '</div></div>';
  h += '<div class="page-actions">' + actions + '</div>';
  h += '<div class="tabs plain" role="tablist" style="margin:0;">';
  tabs.forEach(function (t) {
    var active = tab === t.id;
    var click = t.id === 'icons'
      ? "galleryState.galleryTab='icons';Promise.all([loadTagIcons(),loadTagTitles()]).then(renderGalleryUI);"
      : "galleryState.galleryTab='" + t.id + "';renderGalleryUI()";
    h += '<button role="tab" aria-selected="' + active + '" class="tab-btn' + (active ? ' active' : '') + '" onclick="' + click + '">' + icon(t.ic) + t.label + (t.count !== undefined ? '<span class="tab-count">' + t.count + '</span>' : '') + '</button>';
  });
  h += '</div></div>';

  if (galleryState.showManualForm) h += renderManualForm();

  if (tab === 'browse') {
    h += '<div class="gallery-layout">';
    h += '<div class="gallery-panel"><div class="gallery-panel-header"><h3>' + icon('image') + 'Rendus des commandes</h3></div><div class="gallery-panel-body" id="gallery-browse-panel"></div></div>';
    h += '<div class="gallery-panel gallery-sel-panel">' + renderSelPanel() + '</div>';
    h += '</div>';
  } else if (tab === 'published') {
    h += '<div class="gallery-panel"><div class="gallery-panel-body">' + renderSavedPanel() + '</div></div>';
  } else if (tab === 'icons') {
    h += renderIconsPanel();
  } else if (tab === 'params') {
    h += renderParamsPanel();
  }

  c.innerHTML = h;

  if (!document.getElementById('gal-style')) {
    var s=document.createElement('style');s.id='gal-style';
    s.textContent='.saved-img-card.drag-over{outline:2px dashed var(--primary);opacity:.7;}';
    document.head.appendChild(s);
  }

  if (tab === 'browse') renderBrowsePanel();

  if (galleryState.showManualForm) {
    var inp=document.getElementById('mf-img');var prv=document.getElementById('mf-prev');
    if(inp&&prv)inp.addEventListener('input',function(){prv.src=this.value;prv.style.display=this.value?'block':'none';});
    MARKET_DEFS.forEach(function(md){
      var mInp=document.getElementById('mf-mkt-'+md.code+'-img');
      var mPrv=document.getElementById('mf-mkt-'+md.code+'-prev');
      if(mInp&&mPrv)mInp.addEventListener('input',function(){mPrv.src=this.value;mPrv.style.display=this.value?'block':'none';});
    });
    if (galleryState.editingItemIndex !== null && galleryState.editingItemIndex !== undefined) {
      var editItem = galleryState.savedItems[galleryState.editingItemIndex];
      if (editItem) {
        document.getElementById('mf-img').value = editItem.imageUrl || '';
        document.getElementById('mf-cid').value = editItem.customizationId || '';
        document.getElementById('mf-hdl').value = editItem.productHandle || '';
        document.getElementById('mf-vid').value = editItem.variantId || '';
        document.getElementById('mf-ttl').value = editItem.title || '';
        document.getElementById('mf-niche').value = editItem.niche || '';
        document.getElementById('mf-official').checked = editItem.source === 'official';
        document.getElementById('mf-also-inspiration').checked = editItem.showInInspiration === true;
        document.getElementById('mf-create-page').checked = editItem.createPage === true ? true : editItem.createPage === false ? false : editItem.source === 'official';
        document.getElementById('mf-page-desc').value = editItem.pageDescription || '';
        MARKET_DEFS.forEach(function (md) {
          var code = md.code;
          // Design ancien jamais touché par la fonctionnalité "Marchés" (pas de clé
          // `markets` du tout) -> il est aujourd'hui implicitement visible sur tous les
          // marchés (comportement historique, avant cette fonctionnalité). On précoche donc
          // "Disponible" par défaut pour ne pas le faire disparaître de EN/ES simplement parce
          // qu'on corrige une coquille dans le titre et qu'on ressauvegarde. Un design qui a
          // déjà une entrée `markets` (même partielle) est en revanche respecté tel quel.
          var isLegacyItem = !editItem.markets;
          var m = (editItem.markets && editItem.markets[code]) || {};
          var availEl = document.getElementById('mf-mkt-' + code + '-avail');
          var adaptEl = document.getElementById('mf-mkt-' + code + '-adapt');
          var cidEl = document.getElementById('mf-mkt-' + code + '-cid');
          var imgEl = document.getElementById('mf-mkt-' + code + '-img');
          if (availEl) availEl.checked = isLegacyItem ? true : m.available === true;
          if (adaptEl) adaptEl.checked = m.needsAdaptation === true;
          if (cidEl) cidEl.value = m.customizationId || '';
          if (imgEl) imgEl.value = m.imageUrl || '';
          var mktPrevEl = document.getElementById('mf-mkt-' + code + '-prev');
          if (mktPrevEl) {
            if (m.imageUrl) { mktPrevEl.src = m.imageUrl; mktPrevEl.style.display = 'block'; }
            else { mktPrevEl.style.display = 'none'; }
          }
          onMarketAvailChange(code);
        });
        document.getElementById('mf-tags').value = (editItem.tags || []).join(', ');
        var cpContainer = document.getElementById('mf-campaign-products');
        if (cpContainer) cpContainer.innerHTML = buildCampaignProductsHtml(editItem.niche || '', editItem.campaignProducts || []);
        if (editItem.imageUrl && prv) { prv.src = editItem.imageUrl; prv.style.display = 'block'; }
      }
    }
  }
}

async function uploadImageToField(fileInputId, targetFieldId, previewId){
  var fileInput=document.getElementById(fileInputId);
  var file=fileInput&&fileInput.files[0];
  var err=document.getElementById('mf-err');if(err)err.style.display='none';
  if(!file){if(err){err.textContent='Choisis d\'abord un fichier image';err.style.display='block';}return;}
  try{
    var uploadBlob=file, uploadName=file.name, uploadType=file.type;
    if(file.size>2*1024*1024){
      uploadBlob=await resizeImageForUpload(file,1600,0.85);
      uploadName=file.name.replace(/\.[^.]+$/,'')+'.jpg';
      uploadType='image/jpeg';
    }
    var base64=await fileToBase64(uploadBlob);
    var r=await galleryApi('uploadGalleryImage',{base64Data:base64,filename:uploadName,mimeType:uploadType});
    var targetEl=document.getElementById(targetFieldId);
    if(targetEl)targetEl.value=r.imageUrl;
    var prev=previewId?document.getElementById(previewId):null;
    if(prev){prev.src=r.imageUrl;prev.style.display='block';}
    showToast('Image upload\u00e9e !');
  }catch(e){if(err){err.textContent='Erreur upload: '+e.message;err.style.display='block';}}
}

async function submitManual(){
  var url=document.getElementById('mf-img').value.trim(),cid=document.getElementById('mf-cid').value.trim(),hdl=document.getElementById('mf-hdl').value.trim(),vid=document.getElementById('mf-vid').value.trim(),ttl=document.getElementById('mf-ttl').value.trim()||hdl,niche=document.getElementById('mf-niche').value;
  var tags=document.getElementById('mf-tags').value.split(',').map(function(t){return t.trim().toLowerCase();}).filter(Boolean);
  var isOfficial=document.getElementById('mf-official').checked;
  var alsoInspiration=document.getElementById('mf-also-inspiration').checked;
  var createPage=document.getElementById('mf-create-page').checked;
  var pageDescription=document.getElementById('mf-page-desc').value.trim();
  var markets={};
  MARKET_DEFS.forEach(function(md){markets[md.code]=collectMarketData(md.code);});
  var isEditing=galleryState.editingItemIndex!==null&&galleryState.editingItemIndex!==undefined;
  var err=document.getElementById('mf-err');
  if(!url||!cid||!hdl){err.textContent='URL, ID et Handle obligatoires';err.style.display='block';return;}
  if(!tags.length){err.textContent='Au moins un tag';err.style.display='block';return;}
  if(!isEditing&&isAlreadySaved(url)){err.textContent='D\u00e9j\u00e0 dans la galerie';err.style.display='block';return;}
  var marketsErr=null;
  MARKET_DEFS.forEach(function(md){
    var m=markets[md.code];
    if(m.available&&m.needsAdaptation&&(!m.customizationId||!m.imageUrl))marketsErr='March\u00e9 '+md.label+' : Customization ID et URL du mockup requis quand "N\u00e9cessite une adaptation" est coch\u00e9';
  });
  if(marketsErr){err.textContent=marketsErr;err.style.display='block';return;}
  err.style.display='none';
  try{
    var newItems=galleryState.savedItems.slice();
    var campaignProducts=niche?collectCampaignProducts(niche):[];
    var itemData={imageUrl:url,customizationId:cid,productHandle:hdl,variantId:vid||null,title:ttl,niche:niche||null,tags:tags,source:isOfficial?'official':'customer',showInInspiration:alsoInspiration,campaignProducts:campaignProducts,createPage:createPage,pageDescription:pageDescription,markets:markets,addedAt:new Date().toISOString()};
    if(isEditing){
      var existing=galleryState.savedItems[galleryState.editingItemIndex];
      itemData.addedAt=(existing&&existing.addedAt)||itemData.addedAt;
      // On conserve les infos de la page déjà générée (pageId/handle/url) : la
      // synchro (bouton "Synchroniser les pages designs") s'en sert pour mettre
      // à jour la page existante au lieu d'en recréer une nouvelle.
      if(existing){itemData.pageId=existing.pageId||null;itemData.pageHandle=existing.pageHandle||null;itemData.pageUrl=existing.pageUrl||null;}
      newItems[galleryState.editingItemIndex]=itemData;
    }else{
      newItems.push(itemData);
    }
    await galleryApi('save',{items:newItems});
    galleryState.savedItems=newItems;
    galleryState.showManualForm=false;
    galleryState.editingItemIndex=null;
    showToast(isEditing?'Modifi\u00e9 !':'Ajout\u00e9 !');
    renderGalleryUI();
  }
  catch(e){err.textContent='Erreur: '+e.message;err.style.display='block';}
}

const DELAIS_QUERY = `query {

    id
    delaiProduction: metafield(namespace: "custom", key: "delai_production") { value }
    delaiRush: metafield(namespace: "custom", key: "delai_rush") { value }
    delaiPlancher: metafield(namespace: "custom", key: "delai_plancher_fermeture") { value }
    rushProduct: metafield(namespace: "custom", key: "rush_product") { value }
    rushActif: metafield(namespace: "custom", key: "rush_actif") { value }
    vacances: metafield(namespace: "custom", key: "vacances") { value }
    fomoActif: metafield(namespace: "custom", key: "fomo_actif") { value }
    fomoTexte: metafield(namespace: "custom", key: "fomo_texte") { id value }
    fomoCode: metafield(namespace: "custom", key: "fomo_code") { value }
    fomoFin: metafield(namespace: "custom", key: "fomo_fin") { value }
    fomoPourcentage: metafield(namespace: "custom", key: "fomo_pourcentage") { value }

async function loadDelaisData() {
  const data = await gql(DELAIS_QUERY);
  const s = data.shop;
  state.shopGid = s.id;
  const d = state.delais;
  d.delaiProduction = s.delaiProduction ? s.delaiProduction.value : '';
  d.delaiRush = s.delaiRush ? s.delaiRush.value : '';
  d.delaiPlancher = s.delaiPlancher ? s.delaiPlancher.value : '';
  d.alerteImpression = s.alerteImpression ? s.alerteImpression.value : '1';
  d.alerteFournisseur = s.alerteFournisseur ? s.alerteFournisseur.value : '2';
  d.rushActif = s.rushActif ? s.rushActif.value === 'true' : false;
  d.fomoActif = s.fomoActif ? s.fomoActif.value === 'true' : false;
  d.fomoTexte = s.fomoTexte ? s.fomoTexte.value : '';
  d.fomoTexteId = s.fomoTexte ? s.fomoTexte.id : '';
  d.fomoCode = s.fomoCode ? s.fomoCode.value : '';
  d.fomoFin = s.fomoFin ? s.fomoFin.value : '';
  d.fomoPourcentage = s.fomoPourcentage ? s.fomoPourcentage.value : '';

  // Traductions du texte FOMO (une par marche/langue publiee, hors FR)
  if (d.fomoTexteId) {
    try { await loadFomoTranslations(); } catch (e) { /* pas bloquant */ }
  }

  // Produit rush
  d.rushProductId = ''; d.rushProductTitle = '';
  if (s.rushProduct && s.rushProduct.value) {
    d.rushProductId = s.rushProduct.value;
    try {
      const pdata = await gql('query($id:ID!){ product(id:$id){ title } }', { id: d.rushProductId });
      d.rushProductTitle = pdata.product ? pdata.product.title : '(produit introuvable)';
    } catch (e) { d.rushProductTitle = '(erreur de chargement)'; }
  }

  // Periodes de fermeture
  d.periodes = [];
  d.vacancesGids = [];
  if (s.vacances && s.vacances.value) {
    let gids = [];
    try { gids = JSON.parse(s.vacances.value); } catch (e) { gids = []; }
    d.vacancesGids = gids;
    if (gids.length) {
      const ndata = await gql('query($ids:[ID!]!){ nodes(ids:$ids){ ... on Metaobject { id fields { key value } } } }', { ids: gids });
      d.periodes = (ndata.nodes || []).filter(Boolean).map(function (n) {
        const f = {}; (n.fields || []).forEach(function (fld) { f[fld.key] = fld.value; });
        return { id: n.id, debut: f.debut || '', fin: f.fin || '', label: f.label || '' };
      });
      d.periodes.sort(function (a, b) { return a.debut < b.debut ? -1 : 1; });
    }
  }
  state.delaisLoaded = true;
}

// Le texte FOMO peut etre traduit par langue (le code promo et le pourcentage,
// eux, restent volontairement identiques pour tous les marches).
const FOMO_TRANSLATIONS_QUERY = `query($id: ID!) {
  translatableResource(resourceId: $id) {
    translatableContent { key value digest locale }
    en: translations(locale: "en") { value outdated }
    es: translations(locale: "es") { value outdated }
    de: translations(locale: "de") { value outdated }
    it: translations(locale: "it") { value outdated }
  }
}`;

async function loadFomoTranslations() {
  const d = state.delais;
  const data = await gql(FOMO_TRANSLATIONS_QUERY, { id: d.fomoTexteId });
  const r = data.translatableResource;
  if (!r) return;
  const base = (r.translatableContent || []).find(function (c) { return c.key === 'value'; });
  d.fomoTexteDigest = base ? base.digest : '';
  d.fomoLocales.forEach(function (loc) {
    const t = (r[loc] || [])[0];
    d.fomoTranslations[loc] = { value: t ? t.value : '', outdated: t ? t.outdated : false };
  });
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Shopify date_time metafields are stored as ISO 8601 (UTC). Convert for the datetime-local input.
function toDatetimeLocal(iso) {
  if (!iso) return '';
  const dt = new Date(iso);
  if (isNaN(dt.getTime())) return '';
  const pad = function (n) { return String(n).padStart(2, '0'); };
  return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()) + 'T' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
}

async function metafieldsSetOne(key, value, type, namespace) {
  namespace = namespace || 'custom';
  const mutation = 'mutation($mf:[MetafieldsSetInput!]!){ metafieldsSet(metafields:$mf){ metafields{ id } userErrors{ field message } } }';
  const vars = { mf: [{ ownerId: state.shopGid, namespace: namespace, key: key, value: String(value), type: type }] };
  const data = await gql(mutation, vars);
  const errs = data.metafieldsSet.userErrors;
  if (errs && errs.length) throw new Error(errs.map(function (e) { return e.message; }).join(', '));
}

async function ensureShopGid() {
  if (state.shopGid) return state.shopGid;
  const data = await gql('query{ shop{ id } }');
  state.shopGid = data.shop.id;
  return state.shopGid;
}

async function saveDelaisBase() {
  const prod = document.getElementById('df-delai-production').value.trim();
  const rush = document.getElementById('df-delai-rush').value.trim();
  const plancher = document.getElementById('df-delai-plancher').value.trim();
  try {
    if (prod !== '') await metafieldsSetOne('delai_production', prod, 'number_integer');
    if (rush !== '') await metafieldsSetOne('delai_rush', rush, 'number_integer');
    if (plancher !== '') await metafieldsSetOne('delai_plancher_fermeture', plancher, 'number_integer');
    showToast('D\u00e9lais enregistr\u00e9s');
    await loadDelaisData(); renderDelaisUI();
  } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
}

let _rushSearchTimer = null;
function searchRushProductDebounced(term) {
  clearTimeout(_rushSearchTimer);
  _rushSearchTimer = setTimeout(function () { searchRushProduct(term); }, 350);
}
async function searchRushProduct(term) {
  const box = document.getElementById('df-rush-results');
  if (!term || term.trim().length < 2) { if (box) box.innerHTML = ''; return; }
  try {
    const data = await gql('query($q:String!){ products(first:8, query:$q){ edges{ node{ id title } } } }', { q: 'title:*' + term.trim() + '*' });
    const edges = data.products.edges || [];
    if (!box) return;
    if (!edges.length) { box.innerHTML = '<div class="settings-hint">Aucun résultat</div>'; return; }
    box.innerHTML = '<div class="search-results">' + edges.map(function (e) {
      return '<button type="button" class="search-result" onclick="selectRushProduct(\'' + e.node.id + '\',\'' + escapeHtml(e.node.title).replace(/'/g, "\\'") + '\')">' + escapeHtml(e.node.title) + '<span class="aside" style="color:var(--primary);">Choisir</span></button>';
    }).join('') + '</div>';
  } catch (e) { if (box) box.innerHTML = '<div class="settings-hint text-critical">Erreur : ' + escapeHtml(e.message) + '</div>'; }
}
async function selectRushProduct(id, title) {
  try {
    await metafieldsSetOne('rush_product', id, 'product_reference');
    showToast('Produit rush mis \u00e0 jour');
    await loadDelaisData(); renderDelaisUI();
  } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
}

async function saveFomo() {
  const actif = document.getElementById('df-fomo-actif').checked;
  const pourcentage = document.getElementById('df-fomo-pourcentage').value.trim();
  const code = document.getElementById('df-fomo-code').value.trim();
  const finLocal = document.getElementById('df-fomo-fin').value;
  try {

    if (finLocal) {

      await metafieldsSetOne('fomo_fin', iso, 'date_time');
    }

// \u2500\u2500 Texte FOMO par langue \u2500\u2500
const FOMO_LOCALE_LABELS = { fr: 'FR (r\u00e9f\u00e9rence)', en: 'EN', es: 'ES', de: 'DE', it: 'IT' };

function renderFomoLocaleTabs() {
  const d = state.delais;
  const tabs = ['fr'].concat(d.fomoLocales);
  return '<div class="tabs plain" role="tablist">' +
    tabs.map(function (loc) {
      const active = state.delais.fomoLocaleTab === loc;
      const hasOverride = loc !== 'fr' && d.fomoTranslations[loc] && d.fomoTranslations[loc].value;
      return '<button role="tab" aria-selected="' + active + '" class="tab-btn' + (active ? ' active' : '') + '" onclick="switchFomoLocaleTab(\'' + loc + '\')"' + (hasOverride ? ' title="Texte spécifique enregistré"' : '') + '>' +
        FOMO_LOCALE_LABELS[loc] + (hasOverride ? ' <span class="dot" style="--dot:var(--primary)"></span>' : '') + '</button>';
    }).join('') +
    '</div>';
}

function renderFomoLocaleEditor() {
  const d = state.delais;
  const loc = d.fomoLocaleTab;
  const isFr = loc === 'fr';
  const value = isFr ? d.fomoTexte : (d.fomoTranslations[loc] ? d.fomoTranslations[loc].value : '');
  const hint = isFr
    ? 'Texte de référence, utilisé par toutes les langues qui n’ont pas leur propre texte.'
    : 'Laisser vide pour retomber automatiquement sur le texte FR.' +
      (d.fomoTranslations[loc] && d.fomoTranslations[loc].outdated ? ' <strong class="text-critical">Le texte FR a changé depuis cette traduction — pense à la relire.</strong>' : '');
  return '<div class="form-group"><label for="df-fomo-texte-locale">Texte de l’offre — ' + FOMO_LOCALE_LABELS[loc] + '</label>' +
    '<input type="text" id="df-fomo-texte-locale" value="' + escapeHtml(value) + '" placeholder="ex : -5% sur ta personnalisation !">' +
    '<div class="settings-hint">' + hint + '</div></div>' +
    '<div class="form-actions"><button class="btn btn-primary" onclick="saveFomoTexte()">' + icon('save') + 'Enregistrer ce texte</button></div>';
}

function switchFomoLocaleTab(loc) {
  state.delais.fomoLocaleTab = loc;
  renderDelaisUI();
}

async function saveFomoTexte() {
  const d = state.delais;
  const loc = d.fomoLocaleTab;
  const value = document.getElementById('df-fomo-texte-locale').value.trim();
  try {
    if (loc === 'fr') {
      await metafieldsSetOne('fomo_texte', value, 'single_line_text_field');
    } else {
      if (!d.fomoTexteId) throw new Error('Texte FR de r\u00e9f\u00e9rence introuvable \u2014 enregistre-le d\u2019abord.');
      // On rafra\u00eechit le digest juste avant d\u2019\u00e9crire, pour \u00e9viter un digest perim\u00e9
      // si le texte FR a \u00e9t\u00e9 modifi\u00e9 depuis le chargement de la page.
      await loadFomoTranslations();
      if (value === '') {
        const data = await gql(
          'mutation($id:ID!,$locales:[String!]!){ translationsRemove(resourceId:$id, translationKeys:["value"], locales:$locales){ userErrors{ field message } } }',
          { id: d.fomoTexteId, locales: [loc] }
        );
        const errs = data.translationsRemove.userErrors;
        if (errs && errs.length) throw new Error(errs.map(function (e) { return e.message; }).join(', '));
      } else {
        const data = await gql(
          'mutation($id:ID!,$t:[TranslationInput!]!){ translationsRegister(resourceId:$id, translations:$t){ userErrors{ field message } } }',
          { id: d.fomoTexteId, t: [{ locale: loc, key: 'value', value: value, translatableContentDigest: d.fomoTexteDigest }] }
        );
        const errs = data.translationsRegister.userErrors;
        if (errs && errs.length) throw new Error(errs.map(function (e) { return e.message; }).join(', '));
      }
    }
    showToast('Texte FOMO (' + FOMO_LOCALE_LABELS[loc] + ') enregistr\u00e9');
    await loadDelaisData(); renderDelaisUI();
  } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
}

async function savePeriode() {
  const debut = document.getElementById('np-debut').value;
  const fin = document.getElementById('np-fin').value;
  const label = document.getElementById('np-label').value.trim();
  if (!debut || !fin) { showToast('D\u00e9but et fin requis', 'warning'); return; }
  try {
    const fields = [{ key: 'debut', value: debut }, { key: 'fin', value: fin }];
    if (label) fields.push({ key: 'label', value: label });
    const data = await gql(
      'mutation($input:MetaobjectCreateInput!){ metaobjectCreate(metaobject:$input){ metaobject{ id } userErrors{ field message } } }',
      { input: { type: 'rx_periode_fermeture', fields: fields } }
    );
    const errs = data.metaobjectCreate.userErrors;
    if (errs && errs.length) throw new Error(errs.map(function (e) { return e.message; }).join(', '));
    const newId = data.metaobjectCreate.metaobject.id;
    const gids = state.delais.vacancesGids.concat([newId]);
    await metafieldsSetOne('vacances', JSON.stringify(gids), 'list.metaobject_reference');
    showToast('P\u00e9riode ajout\u00e9e');
    state.delaisShowAddPeriode = false;
    await loadDelaisData(); renderDelaisUI();
  } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
}

async function deletePeriode(id) {
  if (!confirm('Supprimer cette p\u00e9riode de fermeture ?')) return;
  try {
    const gids = state.delais.vacancesGids.filter(function (g) { return g !== id; });
    await metafieldsSetOne('vacances', JSON.stringify(gids), 'list.metaobject_reference');
    await gql('mutation($id:ID!){ metaobjectDelete(id:$id){ deletedId userErrors{ field message } } }', { id: id });
    showToast('P\u00e9riode supprim\u00e9e');
    await loadDelaisData(); renderDelaisUI();
  } catch (e) { showToast('Erreur: ' + e.message, 'error'); }
}

// Enregistre (ou verifie) le webhook orders/create qui pointe vers
// /api/order-delai-webhook. Utilise le proxy /api/shopify existant, donc le
// webhook est bien cree par l'app prep-orders (meme secret que la verification HMAC).
async function setupOrderWebhook() {
  const box = document.getElementById('df-webhook-status');
  box.innerHTML = '<div class="status-line muted">V\u00e9rification\u2026</div>';
  const callbackUrl = window.location.origin + '/api/order-delai-webhook';
  try {
    const existing = await gql('query { webhookSubscriptions(first: 50, topics: [ORDERS_CREATE]) { edges { node { id endpoint { __typename ... on WebhookHttpEndpoint { callbackUrl } } } } } }');
    const already = (existing.webhookSubscriptions.edges || []).find(function (e) {
      return e.node.endpoint && e.node.endpoint.callbackUrl === callbackUrl;
    });
    if (already) {
      box.innerHTML = '<div class="status-line text-success">' + icon('checkCircle') + 'D\u00e9j\u00e0 actif sur ' + escapeHtml(callbackUrl) + '</div>';
      return;
    }
    const data = await gql(
      'mutation($topic:WebhookSubscriptionTopic!, $sub:WebhookSubscriptionInput!){ webhookSubscriptionCreate(topic:$topic, webhookSubscription:$sub){ webhookSubscription{ id } userErrors{ field message } } }',
      { topic: 'ORDERS_CREATE', sub: { callbackUrl: callbackUrl, format: 'JSON' } }
    );
    const errs = data.webhookSubscriptionCreate.userErrors;
    if (errs && errs.length) { box.innerHTML = '<div class="status-line text-critical">' + icon('xCircle') + 'Erreur : ' + escapeHtml(errs.map(function (e) { return e.message; }).join(', ')) + '</div>'; return; }
    box.innerHTML = '<div class="status-line text-success">' + icon('checkCircle') + 'Webhook activ\u00e9 sur ' + escapeHtml(callbackUrl) + '</div>';
    showToast('Webhook activ\u00e9');
  } catch (e) {
    box.innerHTML = '<div class="status-line text-critical">' + icon('xCircle') + 'Erreur : ' + escapeHtml(e.message) + '</div>';
  }
}
